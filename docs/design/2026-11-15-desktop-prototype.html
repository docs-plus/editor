  --radius-lg: var(--radius);
  --radius-xl: calc(var(--radius) * 1.4);
  --tt-gray-a-50: rgba(56, 56, 56, 0.04);
  --tt-gray-a-100: rgba(15, 22, 36, 0.05);

  --tt-gray-a-400: rgba(40, 44, 51, 0.42);
  --tt-gray-a-500: rgba(52, 55, 60, 0.64);
  --tt-gray-a-700: rgba(35, 37, 42, 0.87);
  --tt-canvas-color: #f8f9fa;

/* ── Base ──────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--background); color: var(--foreground);
  font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
.lucide { width: 16px; height: 16px; flex-shrink: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font-family: inherit; font-size: 11px; color: var(--muted-foreground); }
::selection { background: var(--tt-selection-color); }
* { scrollbar-width: thin; scrollbar-color: var(--tt-gray-a-200) transparent; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

/* shadcn Button (components/ui/button.tsx) */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 10px; border-radius: var(--radius-lg); border: 1px solid transparent;
  background: transparent; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: default;
  user-select: none; transition: background-color .15s, color .15s, opacity .15s; flex-shrink: 0;
}
.btn:active:not([disabled]):not([aria-disabled="true"]) { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; }
.btn-sm { height: 28px; padding: 0 10px; gap: 4px; font-size: .8rem; border-radius: var(--radius-md); }
.btn-sm .lucide { width: 14px; height: 14px; }
.btn-xs { height: 24px; padding: 0 8px; gap: 4px; font-size: 12px; border-radius: var(--radius-md); }
.btn-xs .lucide { width: 12px; height: 12px; }
.btn-icon { width: 32px; padding: 0; }
.btn-icon-sm { width: 28px; height: 28px; padding: 0; border-radius: var(--radius-md); }
.btn-icon-xs { width: 24px; height: 24px; padding: 0; border-radius: var(--radius-md); }
.btn-default { background: var(--primary); color: var(--primary-foreground); }
.btn-default:hover { background: color-mix(in oklab, var(--primary) 85%, transparent); }
.btn-outline { border-color: var(--border); background: var(--background); }
.btn-outline:hover, .btn-outline[aria-expanded="true"] { background: var(--muted); }
.dark .btn-outline { border-color: var(--input); background: color-mix(in oklab, var(--input) 30%, transparent); }
.dark .btn-outline:hover { background: color-mix(in oklab, var(--input) 50%, transparent); }
.btn-secondary { background: var(--secondary); color: var(--secondary-foreground); }
.btn-ghost:hover, .btn-ghost[aria-expanded="true"] { background: var(--muted); }
.dark .btn-ghost:hover, .dark .btn-ghost[aria-expanded="true"] { background: color-mix(in oklab, var(--muted) 60%, transparent); }
.btn-destructive { background: color-mix(in oklab, var(--destructive) 10%, transparent); color: var(--destructive); }
.btn-destructive:hover { background: color-mix(in oklab, var(--destructive) 20%, transparent); }
.btn-link { color: var(--primary-ink); padding: 0; height: auto; }
.btn-link:hover { text-decoration: underline; text-underline-offset: 4px; }
.dark .btn-link { color: var(--chart-2); }
.btn[aria-pressed="true"]::after {
  content: ""; position: absolute; bottom: 3px; left: 50%; width: 12px; height: 2px;
  border-radius: 2px; background: var(--pressed-bar); transform: translateX(-50%);
}
.input {
  height: 32px; width: 100%; min-width: 0; border-radius: var(--radius-lg); border: 1px solid var(--input);
  background: transparent; padding: 0 10px; font-size: 14px; outline: none;
}
.input:focus-visible { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 50%, transparent); outline: none; }
.dark .input { background: color-mix(in oklab, var(--input) 30%, transparent); }
.muted { color: var(--muted-foreground); }
.spacer { flex: 1; }

/* ── Window ────────────────────────────────────────────────────────── */
.window { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100vh; }
.titlebar {
  display: flex; align-items: stretch; height: 40px; background: var(--sidebar);
  border-bottom: 1px solid var(--border); user-select: none; position: relative; z-index: 3;
}
.tb-lead { display: flex; align-items: center; gap: 2px; padding: 0 6px 0 10px; flex-shrink: 0; }
[data-sidebar="open"] .tb-lead { width: var(--sb-w); }
.lights { display: flex; gap: 8px; margin-right: 12px; padding-left: 4px; }
.lights span { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12); }
.lights span:nth-child(2) { background: #febc2e; }
.lights span:nth-child(3) { background: #28c840; }
.window:not(.focused) .lights span { background: var(--tt-gray-a-200); }
[data-os="win"] .tb-lead { padding-left: 4px; }
.caption { display: flex; margin-left: auto; flex-shrink: 0; }
.caption button { width: 46px; border: 0; background: transparent; display: grid; place-items: center; cursor: default; }
.caption button .lucide { width: 14px; height: 14px; stroke-width: 1.5; }
.caption button:hover { background: var(--tt-gray-a-100); }
.caption button.close:hover { background: #c42b1c; color: #fff; }
.tb-drag { flex: 1; min-width: 24px; }

/* Tabs (components/tab-bar/tab-bar.scss) */
.tabs { display: flex; align-items: stretch; min-width: 0; overflow-x: auto; padding-left: 4px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { height: 0; }
.tab-wrap {
  position: relative; display: flex; align-items: center; margin-top: 5px; min-width: 100px; max-width: 200px;
  flex: 0 1 200px; border-radius: var(--radius-sm) var(--radius-sm) 0 0; color: var(--tt-gray-a-500);
  transition: background-color .15s, color .15s;
}
.tab-wrap + .tab-wrap::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 6px; width: 1px; background: var(--tt-gray-a-200); }
.tab-wrap.active::before, .tab-wrap.active + .tab-wrap::before { display: none; }
.tab-wrap.pg { min-width: auto; flex: 0 0 auto; }
.tab-wrap:hover { background: var(--tt-gray-a-50); color: var(--tt-gray-a-700); }
.tab-wrap.active { background: var(--background); color: var(--foreground); }
.tab-wrap.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--background); }
.tab {
  display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; height: 100%;
  padding: 0 4px 0 10px; font-size: 13px; font-weight: 450; outline: none; cursor: default; border-radius: inherit;
}
.tab-wrap.active .tab { font-weight: 500; }
.tab:focus-visible { box-shadow: inset 0 0 0 2px var(--focus-ring); }
.tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
.tab .lucide { width: 14px; height: 14px; }
.tab .pg-ic { color: var(--primary-ink); }
.dark .tab .pg-ic { color: var(--chart-2); }
.tab-close {
  width: 20px; height: 20px; margin-right: 6px; border: 0; padding: 0; background: transparent; border-radius: 4px;
  display: grid; place-items: center; opacity: 0; color: inherit;
}
.tab-close .lucide { width: 12px; height: 12px; }
.tab-wrap:hover .tab-close, .tab-wrap.active .tab-close { opacity: .45; }
.tab-close:hover { opacity: 1 !important; background: var(--tt-gray-a-100); }
.tab-new { align-self: center; margin-left: 2px; }

/* ── Body: sidebar + main ──────────────────────────────────────────── */
.body { display: flex; min-height: 0; }
.sidebar {
  width: var(--sb-w); flex-shrink: 0; background: var(--sidebar); color: var(--sidebar-foreground);
  border-right: 1px solid var(--sidebar-border); display: flex; flex-direction: column; min-height: 0; font-size: 13px;
}
[data-sidebar="closed"] .sidebar { display: none; }
[data-sidebar="overlay"] .sidebar { position: absolute; z-index: 8; top: 40px; bottom: 0; left: 0; box-shadow: 0 12px 32px rgba(0,0,0,.18); }
.body { position: relative; }
.sb-scroll { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 1px; }
.sb-search {
  display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; margin-bottom: 6px;
  border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--background);
  color: var(--muted-foreground); font-size: 13px; text-align: left; cursor: default;
}
.dark .sb-search { background: color-mix(in oklab, var(--input) 30%, transparent); }
.sb-search:hover { border-color: var(--ring); }
.sb-search { position: sticky; top: 0; z-index: 1; box-shadow: 0 -8px 0 8px var(--sidebar); flex-shrink: 0; }
.sb-search span { flex: 1; }
.sb-item {
  display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-md);
  background: transparent; text-align: left; cursor: default; width: 100%; font-size: 13px; color: var(--sidebar-foreground);
}
.sb-item .lucide { color: var(--muted-foreground); }
.sb-item:hover { background: var(--sidebar-accent); }
.sb-item[aria-current="page"] { background: var(--sidebar-accent); font-weight: 500; }
.sb-item[aria-current="page"] .lucide { color: var(--sidebar-foreground); }
.sb-item .count { margin-left: auto; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.sb-item .pg-ic { color: var(--primary-ink); }
.dark .sb-item .pg-ic { color: var(--chart-2); }
.sb-sub { list-style: none; margin: 0 0 2px; padding: 0; }
.sb-item.sub { padding-left: 30px; height: 26px; color: var(--sidebar-foreground); }
.sb-item.sub .lucide { width: 14px; height: 14px; }
.sb-item .ti-label { flex: 1; }
.health { color: var(--warn); }
.sb-sep { height: 1px; background: var(--sidebar-border); margin: 6px 4px; flex-shrink: 0; }
.sb-head { display: flex; align-items: center; gap: 2px; padding-right: 2px; }
.sb-head .sb-item { flex: 1; width: auto; }
.sb-foot { display: flex; align-items: center; gap: 2px; padding: 6px 8px; border-top: 1px solid var(--sidebar-border); }
.sb-foot .sb-item { flex: 1; width: auto; }

/* Tree (WAI-ARIA APG Tree View) */
.tree, .tree [role="group"] { list-style: none; margin: 0; padding: 0; }
.tree [role="treeitem"] { outline: none; }
.ti-row {
  display: flex; align-items: center; gap: 6px; height: 28px; padding-right: 8px;
  padding-left: calc(4px + (var(--lvl) - 1) * 14px); border-radius: var(--radius-md); cursor: default;
}
.ti-row:hover { background: var(--sidebar-accent); }
[role="treeitem"][aria-selected="true"] > .ti-row { background: var(--sidebar-accent); font-weight: 500; }
[role="treeitem"]:focus-visible > .ti-row { box-shadow: inset 0 0 0 2px var(--focus-ring); }
.ti-chev { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; color: var(--muted-foreground); flex-shrink: 0; }
.ti-chev .lucide { width: 14px; height: 14px; transition: transform .15s; }
[aria-expanded="true"] > .ti-row .ti-chev .lucide { transform: rotate(90deg); }
.ti-chev:hover { background: var(--tt-gray-a-100); }
.ti-ic { color: var(--muted-foreground); }
.ti-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ti-state { display: inline-flex; color: var(--muted-foreground); }
.ti-state .lucide, .ti-ic.lucide { width: 14px; height: 14px; }
.ti-rename { height: 24px; font-size: 13px; padding: 0 6px; border-radius: var(--radius-sm); }
.ti-hint { font-size: 11px; color: var(--muted-foreground); padding: 2px 8px 4px calc(26px + (var(--lvl) - 1) * 14px); }
.st-ic { position: relative; display: inline-flex; }
.st-ic.dot::after { content: ""; position: absolute; right: -2px; top: -2px; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 1.5px var(--sidebar); }
.tone-ok { color: var(--ok) !important; }
.tone-warn { color: var(--warn) !important; }

/* Main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; container: main / inline-size; position: relative; background: var(--background); }
.toolbar {
  display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px; flex-shrink: 0;
  border-bottom: 1px solid var(--border); background: var(--background); overflow-x: auto; scrollbar-width: none;
}
.tg { display: flex; align-items: center; gap: 2px; }
.tsep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
.tb-face { gap: 4px; padding: 0 6px 0 8px; font-weight: 400; }
.tb-face .chev { width: 12px; height: 12px; opacity: .6; }
.size-field { width: 30px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.colour-a { position: relative; }
.colour-a::before { content: ""; position: absolute; left: 7px; right: 7px; bottom: 4px; height: 2px; border-radius: 1px; background: var(--primary); }
.chip .lucide { width: 14px; height: 14px; }
.chip .chip-word { font-weight: 500; }
.chip.spin .lucide { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.chip .warn-mark { color: var(--warn); }
.chip-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-left: -2px; }
.tb-label { display: inline; }

/* Toolbar ladder (container widths, like smart-toolbar.scss) */
@container main (max-width: 1000px) { [data-t="2"] { display: none !important; } }
@container main (max-width: 860px) { [data-t="3"] { display: none !important; } }
@container main (max-width: 720px) { [data-t="4"] { display: none !important; } }
@container main (max-width: 640px) { .tb-label { display: none; } .chip, .share-btn { width: 28px; padding: 0; } .chip-dot { position: absolute; top: 4px; right: 4px; margin: 0; } }
@container main (max-width: 520px) { [data-t="5"] { display: none !important; } }

/* Document area */
.doc-area { position: relative; flex: 1; min-height: 0; display: flex; }
.scroller { flex: 1; overflow: auto; background: var(--tt-canvas-color); scroll-padding-top: 12px; }
.doc-grid {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 648px) minmax(0, 1fr);
  padding: 12px 16px; min-height: 100%; align-items: start;
}
.outline-margin .doc-grid { grid-template-columns: minmax(250px, 1fr) minmax(0, 648px) minmax(16px, 1fr); }
.page {
  grid-column: 2; grid-row: 1; background: var(--background); border: 1px solid var(--tt-border-color-tint);
  border-radius: var(--radius-sm); box-shadow: var(--tt-page-shadow); min-height: calc(100vh - 110px); overflow: hidden;
}
.pm {
  font-family: Arial, sans-serif; font-size: 15px; line-height: 1.15; padding: 48px 48px 30vh; outline: none; caret-color: var(--foreground);
}
@container main (max-width: 600px) { .pm { padding: 28px 24px 30vh; } .doc-grid { padding: 8px; } }
.pm h1, .pm h2, .pm h3 { font-weight: 700; line-height: 1.15; scroll-margin-top: 12px; }
.pm h1 { font-size: 20pt; margin: 0 0 .5em; }
.pm h2 { font-size: 16pt; margin: 1.15em 0 0; }
.pm h3 { font-size: 14pt; margin: 1em 0 0; }
.pm p { margin: 12px 0 0; }
.pm h1 + p { margin-top: 0; }
.pm ul, .pm ol { margin: 12px 0 0; padding-left: 26px; }
.pm li + li { margin-top: 6px; }
.pm code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .875em; background: var(--tt-gray-a-50); border: 1px solid var(--tt-gray-a-200); border-radius: 6px; padding: .1em .2em; }
.pm pre { margin: 12px 0 0; padding: 1em; background: var(--tt-codeblock-bg); border: 1px solid var(--tt-codeblock-border); border-radius: 6px; overflow-x: auto; }
.pm pre code { background: transparent; border: 0; padding: 0; font-size: 13px; line-height: 1.5; }
.pm .tok-k { color: oklch(0.5 0.15 300); } .pm .tok-s { color: oklch(0.5 0.12 150); } .pm .tok-c { color: var(--muted-foreground); }
.dark .pm .tok-k { color: oklch(0.78 0.12 300); } .dark .pm .tok-s { color: oklch(0.78 0.12 150); }
.pm a { color: var(--primary-ink); text-decoration: underline; text-underline-offset: .15em; }
.pm a.xcard { text-decoration: none; }
.read-only .pm { caret-color: transparent; }

/* X link card and remote image placeholder (in-document) */
.embed { margin: 12px 0 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; user-select: none; }
.xcard { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--background); max-width: 420px; color: inherit; text-decoration: none; }
.xcard:hover { background: var(--tt-gray-a-50); }
.pm a.xcard { color: inherit; }
.sb-item.sub[aria-current="page"] { background: transparent; }
.xcard .xbody { display: flex; flex-direction: column; }
.xcard .xext { width: 13px; height: 13px; color: var(--muted-foreground); }
.xlogo { width: 36px; height: 36px; border-radius: 8px; background: var(--foreground); color: var(--background); display: grid; place-items: center; font: 700 17px/1 Inter, sans-serif; flex-shrink: 0; }
.xbody { min-width: 0; font-size: 13px; line-height: 1.45; }
.xmeta { display: flex; gap: 6px; align-items: baseline; }
.xmeta b { font-weight: 600; }
.xtext { margin: 4px 0 6px; }
.xlink { display: inline-flex; align-items: center; gap: 4px; color: var(--muted-foreground); font-size: 12px; text-decoration: none; }
.xlink .lucide { width: 12px; height: 12px; }
.imgph { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 120px; justify-content: center; border: 1px dashed var(--ring); border-radius: var(--radius-lg); background: var(--tt-gray-a-50); font-size: 13px; line-height: 1.45; }
.imgph .ic { width: 36px; height: 36px; border-radius: 8px; background: var(--muted); display: grid; place-items: center; flex-shrink: 0; color: var(--muted-foreground); }
.imgph p { margin: 0 0 2px; }
.imgph .btn { margin-left: auto; }
.img-loaded { border-radius: var(--radius-lg); overflow: hidden; }
.img-loaded .art { aspect-ratio: 16 / 7; background: linear-gradient(135deg, oklch(0.82 0.08 60), oklch(0.62 0.12 40) 55%, oklch(0.42 0.08 260)); }
.img-loaded figcaption { font-size: 12px; color: var(--muted-foreground); padding: 6px 2px 0; }

/* Inline notice above the document (document-notice.tsx tone) */
.notice { display: flex; align-items: center; gap: 10px; margin: 16px 16px 0; padding: 10px 12px; border-radius: var(--radius-lg); background: var(--muted); font-size: 13px; line-height: 1.4; }
.notice .lucide { color: var(--muted-foreground); }
.notice.warn { background: color-mix(in oklab, var(--chart-2) 14%, var(--background)); }
.notice.warn .lucide { color: var(--warn); }
.notice p { margin: 0; flex: 1; }

/* Outline */
.outline { font-size: 13px; }
.outline-head { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--tt-gray-a-500); padding: 0 10px; margin-bottom: 8px; }
.outline-items { display: flex; flex-direction: column; gap: 1px; list-style: none; margin: 0; padding: 0; }
.ol-item {
  display: block; width: 100%; text-align: left; padding: 4px 10px 4px 6px; border: 0; border-left: 2px solid transparent;
  border-radius: 4px; background: transparent; color: var(--tt-gray-a-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-size: 13px; line-height: 1.5; cursor: default;
}
.ol-item:hover { background: var(--tt-gray-a-50); color: var(--tt-gray-a-700); }
.ol-item[aria-current="true"] { border-left-color: var(--foreground); color: var(--foreground); font-weight: 500; }
.ol-item:focus-visible { outline-offset: -2px; }
.ol-l2 { padding-left: 18px; } .ol-l3 { padding-left: 30px; }
.outline.in-margin { grid-column: 1; grid-row: 1; justify-self: end; position: sticky; top: 0; width: 240px; padding: 16px 8px; margin-right: 10px; max-height: calc(100vh - 100px); overflow-y: auto; }
.outline.overlay {
  position: absolute; left: 8px; top: 8px; z-index: 5; width: 260px; max-height: calc(100% - 16px); overflow-y: auto; padding: 12px 6px;
  background: var(--popover); border-radius: var(--radius-lg); box-shadow: 0 8px 24px rgba(0,0,0,.12); outline: 1px solid color-mix(in oklab, var(--foreground) 10%, transparent);
}

/* List view */
.list-head { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
.list-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin: 0; }
.list-title .lucide { color: var(--muted-foreground); }
.list-count { font-size: 12px; color: var(--muted-foreground); font-weight: 400; }
.list-scroll { flex: 1; overflow: auto; }
table.list { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.list th { position: sticky; top: 0; background: var(--background); text-align: left; font-weight: 500; color: var(--muted-foreground); height: 34px; padding: 0 8px; border-bottom: 1px solid var(--border); z-index: 1; }
.list th button { border: 0; background: transparent; display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px; margin-left: -4px; border-radius: 4px; color: inherit; font-weight: 500; cursor: default; }
.list th button:hover { background: var(--muted); color: var(--foreground); }
.list th .lucide { width: 12px; height: 12px; }
.list td { height: 38px; padding: 0 8px; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list tr[role="row"] { outline: none; cursor: default; }
.list tbody tr:hover td { background: var(--tt-gray-a-50); }
.list tbody tr[aria-selected="true"] td { background: color-mix(in oklab, var(--primary) 9%, transparent); }
.dark .list tbody tr[aria-selected="true"] td { background: color-mix(in oklab, var(--chart-2) 14%, transparent); }
.list tbody tr:focus-visible td { box-shadow: inset 0 2px 0 -0px var(--focus-ring), inset 0 -2px 0 0 var(--focus-ring); }
.list tbody tr:focus-visible td:first-child { box-shadow: inset 2px 2px 0 0 var(--focus-ring), inset 0 -2px 0 0 var(--focus-ring); }
.list tbody tr:focus-visible td:last-child { box-shadow: inset -2px 2px 0 0 var(--focus-ring), inset 0 -2px 0 0 var(--focus-ring); }
.list .c-check { width: 40px; padding-left: 16px; }
.list .c-name { width: auto; }
.list .c-status { width: 120px; }
.list .c-mod { width: 128px; color: var(--muted-foreground); }
.list .c-folder { width: 150px; color: var(--muted-foreground); }
.list input[type="checkbox"] { width: 15px; height: 15px; margin: 0; accent-color: var(--primary); vertical-align: middle; }
.name-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
.name-cell span { overflow: hidden; text-overflow: ellipsis; }
.name-cell .lucide { color: var(--muted-foreground); }
.mini-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted-foreground); }
.mini-chip .lucide { width: 13px; height: 13px; }
.list-foot { display: flex; align-items: center; padding: 12px 16px; font-size: 12px; color: var(--muted-foreground); }
.bulk { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.bulk .n { font-size: 12px; color: var(--muted-foreground); margin-right: 4px; }
@container main (max-width: 620px) { .list .c-folder { display: none; } }
@container main (max-width: 460px) { .list .c-status { display: none; } }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 72px 24px; color: var(--muted-foreground); }
.empty .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--muted); display: grid; place-items: center; margin-bottom: 4px; }
.empty .ic .lucide { width: 32px; height: 32px; }
.empty .ic { background: transparent; }
.empty h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--foreground); }
.empty p { margin: 0; max-width: 340px; font-size: 13px; line-height: 1.5; }

/* Popover (components/ui/popover.tsx) */
.pop {
  position: fixed; z-index: 50; width: 320px; max-width: calc(100vw - 16px); display: flex; flex-direction: column; gap: 10px;
  background: var(--popover); color: var(--popover-foreground); border-radius: var(--radius-lg); padding: 12px; font-size: 13px; line-height: 1.45;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,.08), 0 2px 4px -2px rgba(0,0,0,.06); outline: 1px solid color-mix(in oklab, var(--foreground) 10%, transparent);
  animation: pop-in .1s ease-out;
}
@keyframes pop-in { from { transform: translateY(-4px) scale(.98); } }
.pop[hidden] { display: none; }
.pop h2 { margin: 0; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.pop p { margin: 0; }
.pop .row { display: flex; gap: 6px; flex-wrap: wrap; }
.pop hr { border: 0; border-top: 1px solid var(--border); margin: 2px -12px; }
.pop .field-label { font-size: 12px; font-weight: 500; color: var(--muted-foreground); margin-bottom: -4px; }
.pop .link-row { display: flex; gap: 6px; }
.pop .link-row .input { height: 28px; font-size: 12px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.pop .check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.pop .check input { accent-color: var(--primary); }
.pop .col { display: flex; flex-direction: column; align-items: stretch; gap: 2px; margin: 0 -6px; }
.pop .col .btn { justify-content: flex-start; font-weight: 400; }
.pop .tiny { font-size: 12px; color: var(--muted-foreground); }
.menu { width: 260px; padding: 4px; gap: 0; }
.menu [role="menuitem"] { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-md); background: transparent; text-align: left; font-size: 13px; cursor: default; outline: none; }
.menu [role="menuitem"]:hover, .menu [role="menuitem"]:focus-visible { background: var(--accent); }
.menu [role="menuitem"] kbd { margin-left: auto; }
.menu .menu-label { font-size: 11px; font-weight: 600; color: var(--muted-foreground); padding: 6px 8px 2px; }
.menu hr { margin: 4px -4px; }

/* Dialog (components/ui/dialog.tsx) */
dialog { color: var(--foreground); }
dialog::backdrop { background: rgb(0 0 0 / .12); backdrop-filter: blur(2px); }
.dlg {
  border: 0; padding: 0; width: min(420px, calc(100vw - 32px)); background: var(--background); border-radius: var(--radius-xl);
  box-shadow: 0 10px 30px rgba(0,0,0,.14); outline: 1px solid color-mix(in oklab, var(--foreground) 10%, transparent); font-size: 14px;
}
.dlg[open] { animation: pop-in .12s ease-out; }
.dlg-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.dlg h2 { margin: 0; font-size: 16px; font-weight: 500; line-height: 1.2; }
.dlg .desc { margin: 0; color: var(--muted-foreground); font-size: 14px; line-height: 1.5; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: color-mix(in oklab, var(--muted) 50%, transparent); border-radius: 0 0 var(--radius-xl) var(--radius-xl); }
.dlg-x { position: absolute; top: 8px; right: 8px; }

/* Quick Open */
.qo { width: min(560px, calc(100vw - 32px)); margin-top: 12vh; }
.qo-input { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 44px; border-bottom: 1px solid var(--border); }
.qo-input .lucide { color: var(--muted-foreground); }
.qo-input input { flex: 1; border: 0; outline: none; background: transparent; font-size: 14px; height: 100%; }
.qo-list { list-style: none; margin: 0; padding: 4px; max-height: 320px; overflow-y: auto; }
.qo-list [role="option"] { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px; border-radius: var(--radius-md); font-size: 13px; cursor: default; }
.qo-list [role="option"] .lucide { color: var(--muted-foreground); }
.qo-list [role="option"][aria-selected="true"] { background: var(--accent); }
.qo-list mark { background: transparent; color: inherit; font-weight: 700; }
.qo-list .where { margin-left: auto; font-size: 12px; color: var(--muted-foreground); }
.qo-list .qo-sep { height: 1px; background: var(--border); margin: 4px 0; }
.qo-empty { padding: 4px 8px 8px 32px; color: var(--muted-foreground); font-size: 12px; }
.qo-foot { display: flex; gap: 14px; padding: 8px 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }
.qo-foot kbd { border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-right: 2px; }
.qo-foot .ml { margin-left: auto; }

/* Settings */
.settings { width: min(680px, calc(100vw - 32px)); height: min(520px, calc(100vh - 32px)); overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 .5px rgba(0,0,0,.2), 0 22px 60px rgba(0,0,0,.28); }
.settings[open] { display: flex; flex-direction: column; }
.settings::backdrop { background: transparent; backdrop-filter: none; }
.set-titlebar { display: flex; align-items: center; height: 40px; flex-shrink: 0; background: var(--sidebar); border-bottom: 1px solid var(--border); position: relative; }
.set-titlebar.mac .set-title { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 13px; pointer-events: none; }
.set-titlebar.mac .lights { position: relative; z-index: 1; padding-left: 14px; }
.set-titlebar .lights button { width: 12px; height: 12px; border-radius: 50%; border: 0; padding: 0; background: #ff5f57; }
.set-titlebar .lights span { background: var(--tt-gray-a-200); }
.set-titlebar.win { justify-content: space-between; padding-left: 12px; font-size: 12px; }
.set-titlebar.win .cap-close { width: 46px; height: 40px; border: 0; background: transparent; display: grid; place-items: center; }
.set-titlebar.win .cap-close:hover { background: #c42b1c; color: #fff; }
.settings-grid { display: grid; grid-template-columns: 168px 1fr; flex: 1; min-height: 0; }
.settings-nav { border-right: 1px solid var(--border); padding: 12px 8px; display: flex; flex-direction: column; gap: 1px; background: var(--sidebar); }
.set-row .sel { user-select: text; }
.set-seg { width: auto; }
.set-seg button { padding: 0 10px; }
.switch { width: 32px; height: 18px; border-radius: 9px; border: 0; padding: 2px; background: var(--input); display: flex; }
.switch span { width: 14px; height: 14px; border-radius: 50%; background: var(--background); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--primary); }
.switch[aria-checked="true"] span { transform: translateX(14px); }
.settings-nav h2 { font-size: 13px; padding: 4px 8px 10px; }
.settings-pane { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.settings-pane h3 { margin: 0; font-size: 16px; font-weight: 600; }
.set-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.set-row .lbl { font-weight: 500; font-size: 13px; }
.set-row .val { grid-column: 1; font-size: 12px; color: var(--muted-foreground); }
.set-row .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; word-break: break-all; }
.settings .tiny { font-size: 12px; margin: 0; }
.set-row .acts { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; }
.set-row .sub { grid-column: 1 / -1; font-size: 12px; color: var(--muted-foreground); }
.set-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.note { display: flex; gap: 8px; font-size: 12px; line-height: 1.5; color: var(--muted-foreground); padding: 10px 12px; border-radius: var(--radius-lg); background: var(--muted); }
.note .lucide { width: 14px; height: 14px; margin-top: 2px; }
.note.synced { color: var(--foreground); }
.proto-tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--chart-5); border: 1px dashed var(--chart-3); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
.dark .proto-tag { color: var(--chart-2); }
@media (max-width: 640px) { .settings-grid { grid-template-columns: 1fr; } .settings-nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); border-radius: var(--radius-xl) var(--radius-xl) 0 0; } .settings-nav h2 { display: none; } }

/* First run */
.welcome { width: min(520px, calc(100vw - 32px)); }
.welcome .dlg-body { padding: 28px 28px 20px; gap: 14px; }
.welcome .mark { width: 44px; height: 44px; border-radius: 12px; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; }
.welcome h2 { font-size: 20px; font-weight: 600; }
.welcome .lede { font-size: 14px; line-height: 1.55; margin: 0; }
.folder-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-lg); }
.folder-row .lucide { color: var(--muted-foreground); }
.folder-row .path { flex: 1; min-width: 0; font-size: 13px; overflow-wrap: anywhere; }
.folder-row .btn { flex-shrink: 0; }
.folder-row .path small { display: block; color: var(--muted-foreground); font-size: 12px; }

/* Native-looking dialogs (opened by the main process, §5.4 step 1) */
.native { border: 0; padding: 0; color: #1d1d1f; }
.native.mac {
  width: 380px; border-radius: 14px; background: rgba(242, 242, 242, .98); box-shadow: 0 0 0 .5px rgba(0,0,0,.2), 0 22px 60px rgba(0,0,0,.3);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; font-size: 12px; text-align: center; padding: 20px 18px 16px;
}
.dark .native.mac { background: rgba(48, 48, 50, .98); color: #f5f5f7; box-shadow: 0 0 0 .5px rgba(255,255,255,.15), 0 22px 60px rgba(0,0,0,.6); }
.native .app-ic { width: 56px; height: 56px; border-radius: 13px; margin: 0 auto 10px; background: linear-gradient(180deg, oklch(0.68 0.16 58), oklch(0.52 0.16 45)); color: #fff; display: grid; place-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.native .app-ic .lucide { width: 28px; height: 28px; }
.native.mac h2 { font-size: 13px; font-weight: 700; margin: 0 0 8px; }
.native ul { text-align: left; margin: 8px 0 0; padding-left: 18px; line-height: 1.45; }
.native li + li { margin-top: 3px; }
.native .lead { margin: 0; line-height: 1.45; }
.native label { display: block; text-align: left; margin-top: 12px; font-weight: 600; }
.native input[type="text"] { width: 100%; margin-top: 4px; height: 24px; padding: 0 6px; border: 1px solid rgba(0,0,0,.2); border-radius: 5px; background: #fff; font-size: 13px; }
.dark .native input[type="text"] { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); color: inherit; }
.native a { color: var(--mac-accent); }
.native.mac .nbtns { display: flex; gap: 8px; margin-top: 16px; }
.native.mac .nbtns button { flex: 1; height: 28px; border-radius: 7px; border: 0; font-size: 13px; background: rgba(0,0,0,.08); color: inherit; font-family: inherit; }
.dark .native.mac .nbtns button { background: rgba(255,255,255,.14); }
.native.mac .nbtns button.default { background: var(--mac-accent); color: #fff; }
.native.mac .nbtns button:disabled { opacity: .45; }
.native.win {
  width: 460px; border-radius: 8px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 32px 64px rgba(0,0,0,.28);
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 14px; text-align: left; overflow: hidden;
}
.dark .native.win { background: #2b2b2b; color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 32px 64px rgba(0,0,0,.6); }
.native.win .wtitle { display: flex; align-items: center; height: 32px; padding-left: 12px; font-size: 12px; }
.native.win .wtitle button { margin-left: auto; width: 46px; height: 32px; border: 0; background: transparent; color: inherit; }
.native.win .wbody { padding: 12px 24px 24px; }
.native.win h2 { font-size: 20px; font-weight: 600; margin: 0 0 12px; }
.native.win .nbtns { display: flex; justify-content: flex-end; gap: 8px; padding: 20px 24px; background: #f3f3f3; border-top: 1px solid rgba(0,0,0,.06); }
.dark .native.win .nbtns { background: #202020; border-color: rgba(255,255,255,.06); }
.native.win .nbtns button { min-width: 110px; height: 32px; border-radius: 4px; border: 1px solid rgba(0,0,0,.12); background: #fbfbfb; font-family: inherit; font-size: 14px; color: inherit; }
.dark .native.win .nbtns button { background: #373737; border-color: rgba(255,255,255,.08); }
.native.win .nbtns button.default { background: var(--win-accent); color: #fff; border-color: transparent; }
.dark .native.win .nbtns button.default { color: #000; }
.native.win a { color: var(--win-accent); }
.native.win input[type="text"] { height: 32px; border-radius: 4px; border-bottom: 2px solid var(--win-accent); }
.native::backdrop { background: rgb(0 0 0 / .08); backdrop-filter: none; }

/* Toasts + announcer */
.toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; min-width: 280px; max-width: calc(100vw - 32px); background: var(--popover); color: var(--popover-foreground); border-radius: var(--radius-lg); font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.14); outline: 1px solid color-mix(in oklab, var(--foreground) 10%, transparent); pointer-events: auto; animation: pop-in .15s ease-out; }
.toast span { flex: 1; }

/* Join banner */
.join { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 16px; font-size: 13px; background: color-mix(in oklab, var(--ok) 12%, var(--background)); border-bottom: 1px solid var(--border); }
.join .lucide { color: var(--ok); }
.join p { margin: 0; flex: 1; }

/* Region flash for F6 */
.region-flash { box-shadow: inset 0 0 0 2px var(--focus-ring) !important; }

/* ── Web handoff page ──────────────────────────────────────────────── */
.web { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: var(--tt-canvas-color); }
.web[hidden] { display: none; }
.browser-bar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: var(--sidebar); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.browser-bar .url { flex: 1; max-width: 640px; margin: 0 auto; height: 30px; border-radius: 15px; background: var(--muted); display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 13px; color: var(--muted-foreground); }
.browser-bar .url b { color: var(--foreground); font-weight: 450; }
.browser-bar .url .lucide { width: 14px; height: 14px; }
.web-body { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px 32px; }
.handoff { width: min(440px, 100%); background: var(--background); border: 1px solid var(--tt-border-color-tint); border-radius: var(--radius-xl); box-shadow: var(--tt-page-shadow); padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
.brand .m { width: 26px; height: 26px; border-radius: 7px; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; }
.brand .m .lucide { width: 15px; height: 15px; }
.handoff h1 { margin: 6px 0 0; font-size: 20px; font-weight: 600; line-height: 1.25; }
.handoff p { margin: 0; color: var(--muted-foreground); line-height: 1.5; }
.handoff .btn { height: 36px; width: 100%; }
.handoff .fine { font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted-foreground); border-top: 1px solid var(--border); padding-top: 12px; }
.handoff .fine a { color: inherit; }
.web-doc { width: min(680px, 100%); }
.web-strip { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 13px; background: var(--background); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
.web-strip .lucide { color: var(--ok); }
.web-strip .sep { color: var(--muted-foreground); }

/* ── Prototype controls (not app UI) ───────────────────────────────── */
.proto {
  position: fixed; right: 12px; bottom: 12px; z-index: 70; width: 268px; max-height: calc(100vh - 24px); overflow-y: auto;
  background: var(--popover); color: var(--popover-foreground); border-radius: 12px; font-size: 12px;
  box-shadow: 0 12px 32px rgba(0,0,0,.18); outline: 1.5px dashed var(--chart-3); outline-offset: -1px;
}
.proto-h { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; font-weight: 600; position: sticky; top: 0; background: inherit; border-radius: 12px 12px 0 0; }
.proto-h .lucide { color: var(--chart-3); width: 14px; height: 14px; }
.proto-b { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.proto[data-collapsed="true"] { width: auto; }
.proto[data-collapsed="true"] .proto-b { display: none; }
.pc-row { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 8px; }
.pc-row > span { color: var(--muted-foreground); }
.seg { display: flex; background: var(--muted); border-radius: var(--radius-md); padding: 2px; gap: 2px; }
.seg button { flex: 1; height: 24px; border: 0; border-radius: calc(var(--radius-md) - 2px); background: transparent; font-size: 12px; cursor: default; }
.seg button[aria-pressed="true"] { background: var(--background); box-shadow: 0 1px 2px rgba(0,0,0,.1); font-weight: 500; }
.proto select { width: 100%; height: 28px; border-radius: var(--radius-md); border: 1px solid var(--input); background: var(--background); font-size: 12px; padding: 0 6px; }
.proto .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.proto .grid2 .btn { justify-content: flex-start; font-weight: 400; }
.proto .hint { color: var(--muted-foreground); line-height: 1.45; margin: 0; }
.proto hr { border: 0; border-top: 1px solid var(--border); margin: 0 -12px; }


/* ══ v2: page preferences, organize, review, sharing (designs 2026-11-15) ══ */
/* Page preferences (preferences design §5.4). JS sets the variables on :root; a document's own width sets
   --page-measure on its .doc-area. Card = measure × text size + the 48 px padding on each side. */
:root { --page-size: 16px; --page-measure: 33; --page-leading: 1.6; --page-gap: 1em; --page-list-gap: .35em; --page-heading-leading: 1.2; --page-letter: 0; --page-word: 0; --page-font: Arial, "Liberation Sans", Arimo, sans-serif; }
/* --page-card is declared where it is used, so a document's own --page-measure on .doc-area applies. */
.doc-grid { --page-card: calc(var(--page-measure) * var(--page-size) + 96px); position: relative; grid-template-columns: minmax(0, 1fr) minmax(0, var(--page-card)) minmax(0, 1fr); }
.outline-margin .doc-grid { grid-template-columns: minmax(286px, 1fr) minmax(0, var(--page-card)) minmax(0, 1fr); }
.outline.in-margin { width: min(270px, calc(100% - 16px)); margin-right: 16px; }
.doc-area[data-width="full"] .doc-grid { grid-template-columns: 0 minmax(0, 1fr) 0; padding: 0; }
.doc-area[data-width="full"] .page { border: 0; border-radius: 0; box-shadow: none; min-height: 100%; }
.doc-area[data-width="full"] .pm { padding-left: max(48px, 4vw); padding-right: max(48px, 4vw); }
/* Full: text keeps a readable 46 em; tables, code, images and embeds use the whole width. */
.doc-area[data-width="full"] .pm > :is(p, ul, ol, blockquote, h1, h2, h3, h4, h5, h6) { max-inline-size: calc(46 * var(--page-size)); }
.pm { font-family: var(--page-font); font-size: var(--page-size); line-height: var(--page-leading); letter-spacing: var(--page-letter); word-spacing: var(--page-word); }
.pm h1, .pm h2, .pm h3 { line-height: var(--page-heading-leading); }
.pm h1 { font-size: 1.6667em; }
.pm h2 { font-size: 1.3333em; }
.pm h3 { font-size: 1.1667em; }
.pm p, .pm ul, .pm ol, .pm pre, .pm .embed { margin-top: var(--page-gap); }
.pm li { line-height: var(--page-leading); }
.pm li + li { margin-top: var(--page-list-gap); }
.pm pre code, .pm code { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: normal; word-spacing: normal; }
.pm pre code { font-size: .8125em; }
.pm .embed { letter-spacing: normal; word-spacing: normal; }
.pm h1.is-empty::before { content: "Enter document name"; color: var(--tt-gray-a-400); float: left; height: 0; pointer-events: none; }
.untitled { color: var(--muted-foreground); }
.tab-title, .ti-label, .name-cell span, .pv-t { unicode-bidi: plaintext; }
.spin-ic { animation: spin 1s linear infinite; }
.kind { margin-left: 6px; font-size: 12px; }

/* Menus (one builder for ⋯, Share, Sort, Group, filter chips, context menus) */
.menu { min-width: 240px; width: auto; max-width: 320px; }
.menu [role^="menuitem"] { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-md); background: transparent; text-align: left; font-size: 13px; cursor: default; outline: none; }
.menu [role^="menuitem"]:hover, .menu [role^="menuitem"]:focus-visible { background: var(--accent); }
.menu [role^="menuitem"][aria-disabled="true"] { color: var(--muted-foreground); }
.menu [role^="menuitem"][aria-disabled="true"] .lucide { opacity: .5; }
.menu [role^="menuitem"] kbd { margin-left: auto; padding-left: 12px; }
.menu .mi-l { flex: 1; }
.menu .mi-check { width: 14px; display: inline-flex; }
.menu .mi-check .lucide { width: 14px; height: 14px; }
.menu .mi-sub { margin-left: auto; width: 14px; height: 14px; color: var(--muted-foreground); }
.menu .mi-reason { margin: -2px 0 4px; padding: 0 8px 0 30px; font-size: 11px; line-height: 1.4; color: var(--muted-foreground); }
.menu .menu-title { padding: 6px 8px 2px; font-size: 13px; font-weight: 600; }
.menu .menu-sec { padding: 8px 8px 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
.menu .menu-desc { padding: 0 8px 4px; font-size: 12px; color: var(--muted-foreground); line-height: 1.4; }
.menu .submenu { margin: 2px 0 2px 22px; padding-left: 4px; border-left: 1px solid var(--border); }
.menu .submenu[hidden] { display: none; }

/* Radio segments (Page popover, Settings, list view) */
.seg [role="radio"] { flex: 1; height: 26px; border: 0; border-radius: calc(var(--radius-md) - 2px); background: transparent; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 6px; cursor: default; white-space: nowrap; }
.seg [role="radio"][aria-checked="true"] { background: var(--background); box-shadow: 0 1px 2px rgba(0,0,0,.1); font-weight: 500; }
.dark .seg [role="radio"][aria-checked="true"] { background: var(--accent); }
.seg .rd-check { width: 12px; height: 12px; }
.seg .ag { font-size: 13px; font-weight: 600; margin-right: 2px; }
.page-pop { width: 360px; }
.pp.pp-row { flex-direction: row; align-items: center; gap: 10px; }
.pp.pp-row .field-label { width: 44px; }
.pp.pp-row > .btn { margin-left: auto; }
.sz { display: inline-flex; align-items: center; gap: 4px; }
.sz-step { min-width: 34px; font-weight: 600; }
.sz-step[aria-disabled="true"], .pp-row [aria-disabled="true"] { opacity: .45; }
.sz-val { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; }
.pp-k { margin-left: auto; }
.page-pop .check { min-height: 26px; }
.pp-set { align-self: flex-start; padding: 0; }
/* Find and replace (E1): its own row under the toolbar. It pushes the page down and never covers content. */
.find-bar { flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px; background: var(--background); border-bottom: 1px solid var(--border); font-size: 13px; }
.fb-row { display: flex; align-items: center; gap: 4px; width: 100%; max-width: 620px; }
.fb-gap { width: 24px; flex-shrink: 0; }
.fb-field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 2px 0 8px; border: 1px solid var(--input); border-radius: var(--radius-md); background: var(--background); }
.fb-field:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 35%, transparent); }
.fb-field > .lucide { width: 14px; height: 14px; color: var(--muted-foreground); flex-shrink: 0; }
.fb-field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; height: 100%; font-size: 13px; }
.fb-opt { width: 24px; height: 22px; font-size: 11px; font-weight: 600; }
.fb-opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-foreground); box-shadow: inset 0 0 0 1px var(--ring); }
.fb-w { text-decoration: underline; text-underline-offset: 2px; }
.fb-count { min-width: 64px; text-align: right; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fb-count.none { color: var(--destructive); }
.fb-note { margin: 0 0 2px 28px; font-size: 12px; color: var(--muted-foreground); }
::highlight(find-hit) { background-color: color-mix(in oklab, #f5c518 45%, transparent); }
::highlight(find-cur) { background-color: #f59e0b; color: #1c1c1c; }
/* Word count */
.wc-pop { width: 300px; }
.wc { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.wc th, .wc td { padding: 4px 0; text-align: right; font-weight: 400; }
.wc thead th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-foreground); }
.wc tbody th { text-align: left; color: var(--muted-foreground); }
.wc td { font-weight: 500; padding-left: 16px; }
.wc-meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; padding-top: 8px; border-top: 1px solid var(--border); font-size: 13px; }
.wc-meta dt { color: var(--muted-foreground); }
.wc-meta dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
.sb-more .ti-label { color: var(--muted-foreground); font-size: 12px; }
/* Tags sidebar disclosure */
.sb-disc .sb-chev { width: 12px; height: 12px; margin-right: -2px; color: var(--muted-foreground); }
.pp { display: flex; flex-direction: column; gap: 6px; }
.pp .field-label { margin: 0; }

/* Toolbar extras: presence row, reading bar, follow bar */
.presence { gap: 0; padding: 0 6px; }
.presence .avs { display: inline-flex; align-items: center; padding-left: 4px; }
.av { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 10px/1 Inter, sans-serif; color: #1c1c1c; background: var(--c); box-shadow: 0 0 0 2px var(--background); margin-left: -4px; }
.av-more { font-size: 12px; color: var(--muted-foreground); margin-left: 4px; }
.pc-narrow { display: none; align-items: center; gap: 4px; font-size: 12px; }
@container main (max-width: 640px) { .presence .avs { display: none; } .pc-narrow { display: inline-flex; } }
.read-bar { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 8px; flex-shrink: 0; border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--muted) 60%, var(--background)); font-size: 13px; }
.read-bar .rb-label { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; color: var(--muted-foreground); }
.read-bar kbd { margin-left: 6px; }
.follow-bar { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 16px; font-size: 13px; background: color-mix(in oklab, var(--chart-1) 22%, var(--background)); border-bottom: 1px solid var(--border); }
.follow-bar p { margin: 0; flex: 1; font-weight: 500; }
.dot-c { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex-shrink: 0; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.rcaret { position: relative; display: inline-block; width: 0; height: 1em; vertical-align: text-bottom; user-select: none; }
.rcaret::before { content: ""; position: absolute; left: -1px; top: -.15em; height: 1.3em; width: 2px; background: var(--c); }
.rcaret > span { position: absolute; left: -1px; bottom: 1.15em; font: 600 11px/1.5 Inter, sans-serif; background: var(--c); color: #1c1c1c; padding: 0 4px; border-radius: 3px 3px 3px 0; white-space: nowrap; }
.rcaret.flash > span { box-shadow: 0 0 0 3px var(--focus-ring); }
.people { list-style: none; margin: 0 -4px; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.people li { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 4px; }
.people .pn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.people .ps { font-size: 12px; color: var(--muted-foreground); min-width: 44px; }

/* Updated marker and Show changes */
.upd-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); flex-shrink: 0; display: inline-block; }
.dark .upd-dot { background: var(--chart-2); }
.ti-chev .upd-dot { margin: auto; }
.chg-del { display: none; }
.show-changes .chg-ins { text-decoration: underline 2px; text-decoration-color: var(--ok); text-underline-offset: 3px; background: color-mix(in oklab, var(--ok) 14%, transparent); }
.show-changes .chg-del { display: inline-block; width: 2px; height: 1em; margin: 0 2px; vertical-align: -2px; background: var(--destructive); border-radius: 1px; }
.show-changes .chg-block { position: relative; }
.show-changes .chg-block::before { content: ""; position: absolute; left: -22px; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--ok); }
.show-changes li.chg-block::before { left: -48px; }
.chg-cur { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 2px; }
.notice .btn { flex-shrink: 0; }

/* Tags (Local release, D7 minimal): the row sits under the title */
.tag-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -2px 0 14px; font: 12px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; user-select: none; }
.tag-row #tagAddBtn { color: var(--muted-foreground); padding-left: 4px; }
.tag-row #tagAddBtn:hover { color: var(--foreground); }
.tags { display: contents; list-style: none; }
.tag { display: inline-flex; align-items: center; gap: 2px; height: 24px; padding: 0 2px 0 9px; border-radius: 12px; background: var(--muted); }
.tag button { width: 20px; height: 20px; border: 0; padding: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; color: var(--muted-foreground); }
.tag button:hover { background: var(--tt-gray-a-100); color: var(--foreground); }
.tag button .lucide { width: 12px; height: 12px; }
.tag-info { margin-left: auto; color: var(--muted-foreground); }
.tag-combo { position: relative; }
.tag-combo .input { height: 26px; width: 180px; font-size: 12px; }
.tag-combo ul { position: absolute; z-index: 6; top: calc(100% + 4px); left: 0; width: 220px; list-style: none; margin: 0; padding: 4px; background: var(--popover); border-radius: var(--radius-lg); box-shadow: 0 8px 24px rgba(0,0,0,.12); outline: 1px solid color-mix(in oklab, var(--foreground) 10%, transparent); }
.tag-combo ul:empty { display: none; }
.tag-combo li { padding: 5px 8px; border-radius: var(--radius-md); font-size: 13px; }
.tag-combo li[aria-selected="true"] { background: var(--accent); }
.sb-label { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; font-size: 13px; color: var(--sidebar-foreground); }
.sb-label .lucide { color: var(--muted-foreground); }

/* Comments (Later): margin rail beside the margin outline */
.comments-on .cmt-anchor:not(.is-resolved) { background: color-mix(in oklab, var(--chart-1) 30%, transparent); text-decoration: underline 2px; text-decoration-color: var(--chart-3); text-underline-offset: 3px; cursor: pointer; }
.comments-on .cmt-anchor.active:not(.is-resolved) { background: color-mix(in oklab, var(--chart-1) 55%, transparent); }
.rail { position: absolute; top: 0; width: 260px; z-index: 2; }
.rail[data-mode="markers"] { width: 28px; }
.cmt { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; font-size: 12.5px; line-height: 1.45; background: var(--popover); border-radius: var(--radius-lg); box-shadow: 0 1px 4px rgba(0,0,0,.08); outline: 1px solid color-mix(in oklab, var(--foreground) 10%, transparent); transition: top .12s ease-out; }
.cmt.active { outline: 2px solid var(--chart-3); }
.cmt header { font-size: 12px; }
.cmt q { color: var(--muted-foreground); font-style: italic; }
.cmt p { margin: 0; }
.cmt-sug { display: flex; gap: 6px; align-items: flex-start; }
.cmt-sug .lucide { width: 14px; height: 14px; margin-top: 2px; color: var(--muted-foreground); }
.cmt-reply { border-left: 2px solid var(--border); padding-left: 8px; }
.cmt-acts { display: flex; flex-wrap: wrap; gap: 4px; }
.cmt-form { display: flex; flex-direction: column; gap: 6px; }
.cmt-form .row { display: flex; gap: 4px; align-items: center; }
.cmt-ta { height: auto; min-height: 52px; padding: 6px 8px; font-size: 12.5px; resize: vertical; }
.cmt-mk { position: absolute; left: 0; width: 26px; height: 26px; display: grid; place-items: center; border: 0; border-radius: var(--radius-md); background: var(--popover); color: var(--muted-foreground); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.cmt-mk:hover { color: var(--foreground); }
.cmt-mk .lucide { width: 14px; height: 14px; }
.cmt-panel { position: absolute; right: 8px; top: 8px; z-index: 5; width: 300px; max-width: calc(100% - 16px); max-height: calc(100% - 16px); overflow-y: auto; padding: 10px; background: var(--popover); border-radius: var(--radius-lg); box-shadow: 0 8px 24px rgba(0,0,0,.12); outline: 1px solid color-mix(in oklab, var(--foreground) 10%, transparent); display: flex; flex-direction: column; gap: 8px; }
.cmt-panel .cmt { position: static; box-shadow: none; }
.cmt-panel-h { display: flex; align-items: center; gap: 8px; }
.cmt-panel-h h2 { margin: 0; font-size: 13px; font-weight: 600; flex: 1; }

/* List views: tools, filter bar, groups, preview, drag and drop */
.list-tools { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.list-tools + .bulk { margin-left: 8px; }
.view-seg { width: auto; }

"use strict";
/* ═══ Helpers ═══════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const I = (n, c = "") => `<i data-lucide="${n}" class="${c}" aria-hidden="true"></i>`;

const mod = () => (S.os === "mac" ? "⌘" : "Ctrl+");

  const d = Date.now() - ts;
  if (d < MIN) return "Just now";
  if (d < HOUR) return `${Math.round(d / MIN)} min ago`;
  if (d < DAY) return `${Math.round(d / HOUR)} h ago`;
  if (d < 2 * DAY) return "Yesterday";
  return new Date(ts).toLocaleDateString("en-GB", { day: "numeric", month: "short" });

function rowClick(id, e) {
  const ids = listRows(S.list).map((r) => r.id);
  if (e.shiftKey && S.anchor) {
    const [a, b] = [ids.indexOf(S.anchor), ids.indexOf(id)].sort((x, y) => x - y);
    if (!(e.metaKey || e.ctrlKey)) S.selection.clear();
    ids.slice(a, b + 1).forEach((x) => S.selection.add(x));
  } else if (e.metaKey || e.ctrlKey) {
    S.selection.has(id) ? S.selection.delete(id) : S.selection.add(id); S.anchor = id;
  } else { S.selection = new Set([id]); S.anchor = id; }
  S.rowFocus = id;
  renderMain(); icons();
  $(`[data-row="${CSS.escape(id)}"]`)?.focus();
}


/* Quick Open keys */
$("#qoInput").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); qoIndex = Math.min(qoIndex + 1, qoItems.length - 1); renderQO(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); qoIndex = Math.max(qoIndex - 1, 0); renderQO(); }
  else if (e.key === "Enter") { e.preventDefault(); if (e.altKey && (e.metaKey || e.ctrlKey) || (S.os === "win" && e.shiftKey)) toast("Opens in a new window in the app."); pickQO(qoIndex, e.metaKey || e.ctrlKey); }
});

/* Tree keyboard (APG) */
function treeItems() { return $$('.tree [role="treeitem"]'); }
function focusTree(el) { if (!el) return; treeItems().forEach((t) => (t.tabIndex = -1)); el.tabIndex = 0; S.treeFocus = el.dataset.key; el.focus(); }
let typeBuf = "", typeTimer;
function treeKey(e, ti) {
  const items = treeItems(), i = items.indexOf(ti), key = ti.dataset.key, isFolder = key.startsWith("f:"), fid = key.slice(2);
  const open = ti.getAttribute("aria-expanded") === "true";
  switch (e.key) {
    case "ArrowDown": e.preventDefault(); focusTree(items[i + 1]); break;
    case "ArrowUp": e.preventDefault(); focusTree(items[i - 1]); break;
    case "Home": e.preventDefault(); focusTree(items[0]); break;
    case "End": e.preventDefault(); focusTree(items[items.length - 1]); break;
    case "ArrowRight": e.preventDefault();
      if (isFolder && !open) { S.expanded.add(fid); renderSidebar(); icons(); focusTree($(`[data-key="${key}"]`)); }
      else if (isFolder) focusTree($('[role="treeitem"]', $(`[data-key="${key}"] > [role="group"]`)));
      break;
    case "ArrowLeft": e.preventDefault();
      if (isFolder && open) { S.expanded.delete(fid); renderSidebar(); icons(); focusTree($(`[data-key="${key}"]`)); }
      else focusTree(ti.parentElement.closest('[role="treeitem"]'));
      break;
    case "Enter": e.preventDefault();
      if (isFolder) { S.expanded.add(fid); openList("folder", fid, { newTab: e.metaKey || e.ctrlKey }); $('tr[data-row][tabindex="0"]')?.focus(); }
      else openDoc(fid, { newTab: e.metaKey || e.ctrlKey });
      break;
    case "F2": e.preventDefault(); S.renaming = key; renderSidebar(); icons(); { const ri = $("#renameInput"); ri.focus(); ri.select(); } break;
    case "Delete": case "Backspace":
      if (e.key === "Backspace" && !e.metaKey) break;
      e.preventDefault(); trashDocs([isFolder ? key : fid]); break;
    case "*": e.preventDefault(); Object.keys(FOLDERS).forEach((f) => { if (FOLDERS[f].parent === (isFolder ? FOLDERS[fid].parent : DOCS[fid].folder)) S.expanded.add(f); }); renderSidebar(); icons(); focusTree($(`[data-key="${key}"]`)); break;
    default:
      if (e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey) {
        clearTimeout(typeTimer); typeBuf += e.key.toLowerCase(); typeTimer = setTimeout(() => (typeBuf = ""), 600);
        const label = (t) => t.querySelector(".ti-label")?.textContent.toLowerCase() || "";
        const order = items.slice(i + 1).concat(items.slice(0, i + 1));
        const hit = order.find((t) => label(t).startsWith(typeBuf)); if (hit) focusTree(hit);
      }
  }
}

/* Tabs keyboard */
function tabKey(e, tab) {
  const tabs = $$('[role="tab"]'), i = tabs.indexOf(tab);
  const to = (j) => { const t = tabs[(j + tabs.length) % tabs.length]; S.activeTab = t.dataset.tab; syncActive(); renderAll(); $(`[data-tab="${S.activeTab}"]`)?.focus(); };
  if (e.key === "ArrowRight") { e.preventDefault(); to(i + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); to(i - 1); }
  else if (e.key === "Home") { e.preventDefault(); to(0); }
  else if (e.key === "End") { e.preventDefault(); to(tabs.length - 1); }
  else if (e.key === "Delete") { e.preventDefault(); closeTab(tab.dataset.tab); }
}

/* Toolbar roving focus */
function toolbarKey(e) {
  if (!["ArrowRight", "ArrowLeft", "Home", "End"].includes(e.key)) return;
  const btns = $$("#toolbar button").filter((b) => b.offsetParent !== null);
  const i = btns.indexOf(document.activeElement);
  if (i < 0) return;
  e.preventDefault();
  const j = e.key === "Home" ? 0 : e.key === "End" ? btns.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + btns.length) % btns.length;
  btns.forEach((b) => (b.tabIndex = -1)); btns[j].tabIndex = 0; btns[j].focus();
}

/* F6 regions: Files, Open documents, Formatting, Document, Outline */
let lastSidebarFocus = null;
document.addEventListener("focusin", (e) => { if (e.target.closest?.("#sidebar")) lastSidebarFocus = e.target; });
function toggleSidebar() {
  if (narrow()) S.sbOverlay = !S.sbOverlay; else S.sidebar = !S.sidebar;
  renderAll(); announce(sidebarShown() ? "Sidebar shown" : "Sidebar hidden");
}
function cycleRegion(back) {
  const rs = regions();
  let i = rs.findIndex((r) => r.el && r.el.contains(document.activeElement));
  i = i < 0 ? (back ? 0 : -1) : i;
  const next = rs[(i + (back ? -1 : 1) + rs.length) % rs.length];
  const t = next.focus();
  if (t) { if (t.id === "listHead" || t.id === "listEmpty") t.tabIndex = -1; t.focus(); }
  next.el.classList.add("region-flash");
  setTimeout(() => next.el.classList.remove("region-flash"), 1000);
  const names = { sidebar: "Files", toolbar: "Formatting", outline: "Outline" };
  announce(next.el.getAttribute("aria-label") || names[next.el.id] || "Document");
}

document.addEventListener("focusout", (e) => { if (e.target.id === "renameInput" && S.renaming) setTimeout(() => commitRename(false, { blur: true }), 0); });
document.addEventListener("focusin", (e) => {
  const ti = e.target.closest?.('.tree [role="treeitem"]');
  if (ti && e.target === ti) { S.treeFocus = ti.dataset.key; }
});

let lastMargin = outlineInMargin(), lastNarrow = narrow();
window.addEventListener("resize", () => {
  if (narrow() !== lastNarrow) { lastNarrow = narrow(); S.sbOverlay = false; lastMargin = outlineInMargin(); renderAll(); return; }
  const m = outlineInMargin();
  if (m !== lastMargin) { lastMargin = m; S.outlineOverlay = false; if (S.active !== "list") { renderMain(); icons(); } }
  if (!$("#pop").hidden) closePop();
});
window.addEventListener("blur", () => $("#win").classList.remove("focused"));
window.addEventListener("focus", () => $("#win").classList.add("focused"));

syncActive();
renderAll();
