<title>Smart chips prototype</title>
<!--
  Throwaway clickable prototype for §4.2a "Smart chips" in
  docs/superpowers/specs/2026-11-16-search-linking-design.md (proposed, 2026-11-22).
  Not app code. The editor is a tiny document model (text units plus chip units) with its own caret,
  so caret, selection and delete behave exactly as the spec's key table says and screenshots are
  deterministic. The chip markup is the spec's node view markup, byte for byte where it matters
  (role, contenteditable, data-link-state, the aria-hidden icon wrapper holding U+2060, <bdi>, the hidden
  suffix, no href, no aria-label, no title). Tokens are app/globals.css values. The only dependency is lucide 0.469.0.
  window.proto.scene(id) sets every scene the screenshots use.
-->
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" integrity="sha384-hJnF5AwidE18GSWTAGHv3ByzzvfNZ1Tcx5y1UUV3WkauuMCEzBJBMSwSt/PUPXnM" crossorigin="anonymous"></script>
<style>
:root {
  color-scheme: light;
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --popover: oklch(1 0 0);
  --popover-foreground: oklch(0.145 0 0);
  --secondary: oklch(0.967 0.001 286.375);
  --secondary-foreground: oklch(0.21 0.006 285.885);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0);
  --destructive: oklch(0.577 0.245 27.325);
  --border: oklch(0.922 0 0);
  --bubble-edge: oklch(0.87 0 0);
  --focus-ring: oklch(0.439 0 0);
  --page-bg: oklch(0.985 0.002 247);
  --selection: oklch(0.88 0.06 250);
  --selection-fg: inherit;
  --link: oklch(0.49 0.17 258);
  --radius: 0.45rem;
  --shadow: 0 4px 16px oklch(0 0 0 / 0.10), 0 1px 3px oklch(0 0 0 / 0.08);
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --pill-bg: oklch(0.205 0 0);
  --pill-fg: oklch(0.985 0 0);
  /* §4.2a tokens. In the app they live in the lazy lib/links/doc-links.css, never --tt-*. */
  --doc-chip-bg: var(--secondary);
  --doc-chip-fg: var(--foreground);
  --doc-chip-border: var(--muted-foreground);
  --doc-chip-icon: var(--muted-foreground);
  --doc-chip-danger: var(--destructive);
  --doc-chip-hover: oklch(0.93 0.002 286);
  --doc-chip-broken-fg: var(--foreground);
  --doc-chip-broken-border: var(--muted-foreground);
  --ed-size: 16px;
  --ed-lead: 1.6;
}
.dark {
  color-scheme: dark;
  --background: oklch(0.145 0 0);
  --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0);
  --popover: oklch(0.205 0 0);
  --popover-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.274 0.006 286.033);
  --secondary-foreground: oklch(0.985 0 0);
  --muted: oklch(0.269 0 0);
  --muted-foreground: oklch(0.708 0 0);
  --accent: oklch(0.269 0 0);
  --destructive: oklch(0.704 0.191 22.216);
  --border: oklch(1 0 0 / 10%);
  --bubble-edge: oklch(1 0 0 / 36%);
  --focus-ring: oklch(0.87 0 0);
  --page-bg: oklch(0.17 0 0);
  --selection: oklch(0.42 0.08 250);
  --link: oklch(0.76 0.12 255);
  --shadow: 0 6px 20px oklch(0 0 0 / 0.5), 0 1px 3px oklch(0 0 0 / 0.4);
  --pill-bg: oklch(0.92 0 0);
  --pill-fg: oklch(0.145 0 0);
  --doc-chip-hover: oklch(0.32 0.006 286);
}
/* Forced colours: the real media query, and the same tokens under the "Simulated" control. */
@media (forced-colors: active) {

    --background: Canvas; --foreground: CanvasText; --card: Canvas; --popover: Canvas; --popover-foreground: CanvasText;
    --secondary: Canvas; --muted: Canvas; --muted-foreground: CanvasText; --accent: Canvas; --border: CanvasText;
    --bubble-edge: CanvasText; --focus-ring: Highlight; --page-bg: Canvas; --selection: Highlight; --selection-fg: HighlightText;
    --link: LinkText; --pill-bg: Canvas; --pill-fg: CanvasText; --shadow: none;
    --doc-chip-bg: Canvas; --doc-chip-fg: LinkText; --doc-chip-border: LinkText; --doc-chip-icon: LinkText;
    --doc-chip-danger: CanvasText; --doc-chip-hover: Canvas; --doc-chip-broken-fg: CanvasText; --doc-chip-broken-border: CanvasText;
  }
  .sel, .doc-chip.in-sel, .caret::after { forced-color-adjust: none; }
  .pill { border: 1px solid CanvasText; }
  /* Prototype chrome only: pressed and selected states as Highlight, so their text stays visible. */
  .seg button[aria-pressed="true"], .ias .seg button[aria-checked="true"], .log .k.ann, .primary, .a11y tr.focus td, .opt[aria-selected="true"] {
    forced-color-adjust: none; background: Highlight !important; color: HighlightText !important; border-color: Highlight !important;
  }
}
:root[data-fc="on"], :root[data-fc="on"].dark {
  --background: Canvas; --foreground: CanvasText; --card: Canvas; --popover: Canvas; --popover-foreground: CanvasText;
  --secondary: Canvas; --muted: Canvas; --muted-foreground: CanvasText; --accent: Canvas; --border: CanvasText;
  --bubble-edge: CanvasText; --focus-ring: Highlight; --page-bg: Canvas; --selection: Highlight; --selection-fg: HighlightText;
  --link: LinkText; --pill-bg: Canvas; --pill-fg: CanvasText; --shadow: none;
  --doc-chip-bg: Canvas; --doc-chip-fg: LinkText; --doc-chip-border: LinkText; --doc-chip-icon: LinkText;
  --doc-chip-danger: CanvasText; --doc-chip-hover: Canvas; --doc-chip-broken-fg: CanvasText; --doc-chip-broken-border: CanvasText;
}
:root[data-fc="on"] .pill { border: 1px solid CanvasText; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page-bg); color: var(--foreground);
}
:root[data-motion="reduce"] *, :root[data-motion="reduce"] *::after { transition: none !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::after { transition: none !important; animation: none !important; } }
button, input, select { font: inherit; color: inherit; }
svg.lucide { width: 16px; height: 16px; stroke-width: 2; flex: none; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
kbd { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 2px 4px; border: 1px solid var(--border); border-block-end-width: 2px; border-radius: 4px; background: var(--muted); }

/* ── Controls ───────────────────────────────────────────── */
.controls {
  position: sticky; top: 0; z-index: 100; background: var(--card); border-block-end: 1px solid var(--border);
  padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12px;
}
.controls h1 { font-size: 13px; margin: 0; margin-inline-end: 6px; font-weight: 600; }
.ctl { display: inline-flex; align-items: center; gap: 4px; }
.ctl > span { color: var(--muted-foreground); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 3px 7px; cursor: pointer; font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--foreground); color: var(--background); }
.controls select { font-size: 12px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--background); max-width: 100%; }
.btn { border: 1px solid var(--border); background: var(--background); border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
.btn:hover { background: var(--muted); }

/* ── Layout ─────────────────────────────────────────────── */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 16px; padding: 12px 16px 24px; align-items: start; }
@media (max-width: 1100px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.scene-note { font-size: 12px; color: var(--muted-foreground); margin: 0 0 8px; min-height: 18px; }
.scene-note b { color: var(--foreground); font-weight: 600; }
.stage { min-width: 0; display: flex; flex-direction: column; align-items: center; }
.stage > .scene-note { align-self: stretch; }
.win {
  position: relative; width: 100%; height: 760px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  display: flex; flex-direction: column; background: var(--background);
}
.win[data-device="phone"] { width: 390px; height: 780px; border: 10px solid oklch(0.25 0 0); border-radius: 40px; }
.tabs { display: flex; align-items: end; gap: 4px; height: 36px; padding-inline: 10px; background: var(--page-bg); border-block-end: 1px solid var(--border); flex: none; overflow: hidden; }
.tab { padding: 6px 12px; border-radius: 8px 8px 0 0; font-size: 12.5px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.tab.on { background: var(--background); color: var(--foreground); }
.tab .badge { font-size: 10.5px; border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; }
.topbar { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 10px; border-block-end: 1px solid var(--border); background: var(--background); flex: none; font-size: 13px; }
.topbar .crumb { color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .grow { flex: 1; }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: transparent; cursor: pointer; }
.tb:hover { background: var(--muted); }
[dir="rtl"] .flip-rtl { transform: scaleX(-1); }
.scroller { position: relative; flex: 1; overflow: auto; background: var(--page-bg); }
.page { max-width: 760px; margin: 20px auto 120px; background: var(--background); padding: 36px 56px 48px; border-radius: 8px; border: 1px solid var(--border); }
.win[data-device="phone"] .scroller { background: var(--background); }
.win[data-device="phone"] .page { margin: 0; border: 0; border-radius: 0; padding: 20px 16px 120px; }

/* ── Editor ─────────────────────────────────────────────── */
#ed { outline: none; font-size: var(--ed-size); line-height: var(--ed-lead); cursor: text; overflow-wrap: break-word; }
#ed[aria-readonly="true"] { cursor: default; }
#ed h1 { font-size: 1.85em; line-height: 1.2; margin: 0 0 .6em; font-weight: 700; }
#ed h2 { font-size: 1.3em; line-height: 1.3; margin: 1.3em 0 .45em; font-weight: 650; }
#ed p { margin: 0 0 .8em; }
#ed .r { white-space: pre-wrap; }
.sel { background: var(--selection); color: var(--selection-fg); }
.caret { position: relative; }
.caret::after { content: ""; position: absolute; inset-block: 0; inset-inline-start: -1px; width: 2px; background: var(--foreground); animation: blink 1.06s steps(1, end) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#ed a.doc-link { color: var(--link); text-decoration: underline; text-underline-offset: .18em; cursor: pointer; }
#ed a.doc-link[data-card-open] { outline: 2px solid var(--focus-ring); outline-offset: 1px; border-radius: 2px; }
.doc-link-icon { display: inline-flex; vertical-align: -0.125em; margin-inline-end: .15em; color: var(--muted-foreground); }
.doc-link-icon > svg { width: 1em; height: 1em; }

/* §4.2a: the chip. Inline, padding-block 0, so the line box never grows. */
.doc-chip {
  display: inline; padding-block: 0; padding-inline: .3em .45em;
  border: max(1px, .0625em) solid var(--doc-chip-border); border-radius: 999px;
  background: var(--doc-chip-bg); color: var(--doc-chip-fg);
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  overflow-wrap: anywhere; cursor: pointer; font-weight: 500;
  transition: background-color .12s var(--ease);
}
.doc-chip:hover { background: var(--doc-chip-hover); }
/* The icon is out of flow inside an inline wrapper that reserves its width. An in-flow <svg> is an
   atomic inline, and Chromium allows a line break after it even before U+2060, which strands the icon
   at the end of a line. The wrapper has no break opportunity, so the icon always starts the title's line. */
.doc-chip-icon { position: relative; padding-inline-end: 1.25em; }
.doc-chip-icon > svg { position: absolute; inset-inline-start: 0; top: 50%; transform: translateY(-50%); width: 1em; height: 1em; color: var(--doc-chip-icon); stroke-width: 2; }
.doc-chip[data-link-state="deleted"] .doc-chip-icon > svg { color: var(--doc-chip-danger); }
.doc-chip:is([data-link-state="deleted"], [data-link-state="not_in_library"], [data-link-state="unknown_form"]) {
  border-style: dashed; border-color: var(--doc-chip-broken-border); color: var(--doc-chip-broken-fg);
}
.doc-chip.in-sel { background: var(--selection); color: var(--selection-fg); }
.doc-chip:focus-visible, .doc-chip[data-card-open] { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
@media print {
  .doc-chip { border: 0; background: none; padding: 0; color: inherit; font-weight: inherit; }
  .doc-chip-icon { display: none; }
}

/* ── Overlays ───────────────────────────────────────────── */
.pop {
  position: absolute; z-index: 30; background: var(--popover); color: var(--popover-foreground);
  border: 1px solid var(--bubble-edge); border-radius: 10px; box-shadow: var(--shadow);
  animation: pop-in .12s var(--ease);
}
@keyframes pop-in { from { opacity: 0; transform: translateY(-3px); } }
.ghost { position: absolute; z-index: 25; color: var(--muted-foreground); pointer-events: none; white-space: nowrap; }

.slash { width: 300px; max-height: 340px; display: flex; flex-direction: column; font-size: 13px; }
.slash .list { overflow: auto; padding: 4px; }
.grp-label { font-size: 11px; color: var(--muted-foreground); padding: 8px 8px 4px; font-weight: 600; }
.opt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; min-height: 32px; }
.opt[aria-selected="true"] { background: var(--accent); box-shadow: inset 2px 0 0 var(--foreground); }
[dir="rtl"] .opt[aria-selected="true"] { box-shadow: inset -2px 0 0 var(--foreground); }
.opt .hint { margin-inline-start: auto; color: var(--muted-foreground); font-size: 12px; }
.opt .path { margin-inline-start: auto; color: var(--muted-foreground); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.opt .badge { font-size: 10.5px; border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; color: var(--muted-foreground); }
.foot { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-block-start: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }
.foot .grow { flex: 1; }
.foot button { border: 0; background: transparent; cursor: pointer; padding: 3px 6px; border-radius: 4px; color: var(--muted-foreground); }
.foot button:hover { background: var(--muted); }

.picker { width: 460px; font-size: 13px; display: flex; flex-direction: column; max-height: 420px; }
.pk-in { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-block-end: 1px solid var(--border); }
.pk-in input { flex: 1; border: 0; background: transparent; outline: none; font-size: 14px; min-width: 0; }
.pk-in .step { font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.pk-list { overflow: auto; padding: 4px; flex: 1; min-height: 60px; }
.pk-empty { padding: 12px; color: var(--muted-foreground); }
.ias { display: inline-flex; align-items: center; gap: 6px; }
.ias .seg button { font-size: 12px; padding: 2px 8px; }
.ias .seg button[aria-checked="true"] { background: var(--foreground); color: var(--background); }
.ias .seg button[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.pk-note { padding: 0 10px 8px; font-size: 12px; color: var(--muted-foreground); }

.card { width: 340px; padding: 12px; font-size: 13px; }
.card:focus { outline: none; }
.card-head { display: flex; gap: 8px; align-items: flex-start; }
.card-head svg { margin-block-start: 2px; color: var(--muted-foreground); }
.card-head svg.danger { color: var(--destructive); }
.card-title { font-weight: 600; font-size: 14px; }
.card-meta { color: var(--muted-foreground); font-size: 12px; margin-block-start: 2px; }
.card-msg { margin: 8px 0 0; }
.card-snip { margin: 6px 0 0; color: var(--muted-foreground); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-block-start: 10px; }
.act { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--background); border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12.5px; }
.act:hover { background: var(--muted); }
.actions + .actions { border-block-start: 1px solid var(--border); padding-block-start: 10px; }
.card.sheet { inset-inline: 0 !important; inset-block-end: 0 !important; inset-block-start: auto !important; left: 0 !important; width: auto; border-radius: 16px 16px 0 0; padding: 16px; }
.card.sheet .actions { flex-direction: column; gap: 0; }
.card.sheet .act { min-height: 44px; border: 0; border-block-start: 1px solid var(--border); border-radius: 0; font-size: 15px; justify-content: flex-start; padding-inline: 4px; width: 100%; }
.card.sheet .actions + .actions { padding-block-start: 0; margin-block-start: 0; }
.sheet-grip { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: -6px auto 10px; }

.scrim { position: absolute; inset: 0; z-index: 40; background: oklch(0 0 0 / .35); }
.consent { z-index: 41; width: min(400px, calc(100% - 32px)); inset-inline-start: 50%; top: 30%; transform: translateX(-50%); padding: 18px; }
[dir="rtl"] .consent { transform: translateX(50%); }
.consent h2 { font-size: 15px; margin: 0 0 8px; }
.consent p { margin: 0 0 14px; }
.row-end { display: flex; justify-content: flex-end; gap: 8px; }
.primary { background: var(--foreground) !important; color: var(--background) !important; border-color: var(--foreground) !important; }

#pills { position: absolute; inset-inline: 0; bottom: 18px; z-index: 35; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding-inline: 16px; }
.pill { pointer-events: auto; display: flex; gap: 10px; align-items: center; background: var(--pill-bg); color: var(--pill-fg); border-radius: 10px; padding: 8px 10px 8px 14px; font-size: 13px; max-width: 560px; box-shadow: var(--shadow); animation: pop-in .12s var(--ease); }
.pill button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 6px; padding: 3px 8px; cursor: pointer; white-space: nowrap; font-size: 12.5px; }

.target h1 { font-size: 1.85em; margin: 0 0 .2em; line-height: 1.2; }
.target .meta { color: var(--muted-foreground); font-size: 13px; margin: 0 0 1.2em; }
.target h2 { font-size: 1.3em; margin: 1.3em 0 .45em; }
.target:focus { outline: none; }
.target { font-size: var(--ed-size); line-height: var(--ed-lead); }
.banner { display: flex; gap: 10px; align-items: center; border: 1px solid var(--border); background: var(--muted); border-radius: 8px; padding: 8px 12px; margin-block-end: 16px; font-size: 13px; }
.proto-note { margin-block-start: 2em; font-size: 12px; color: var(--muted-foreground); border-block-start: 1px dashed var(--border); padding-block-start: 8px; }

/* ── Side panel ─────────────────────────────────────────── */
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.box h2 { font-size: 12.5px; margin: 0 0 6px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.box h2 .grow { flex: 1; }
.lib-list { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.lib-list li { display: flex; align-items: center; gap: 6px; padding: 3px 0; min-height: 28px; border-block-end: 1px solid var(--border); }
.lib-list li:last-child { border-block-end: 0; }
.lib-list .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-list .tag { font-size: 10.5px; border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; color: var(--muted-foreground); white-space: nowrap; }
.lib-list button { border: 0; background: transparent; cursor: pointer; padding: 3px; border-radius: 4px; color: var(--muted-foreground); display: inline-flex; }
.lib-list button:hover { background: var(--muted); color: var(--foreground); }
.lib-list input { flex: 1; min-width: 0; font-size: 12.5px; padding: 2px 6px; border: 1px solid var(--focus-ring); border-radius: 4px; background: var(--background); }
.clip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-block-start: 8px; font-size: 12px; }
.clip input { flex: 1 1 100%; font: 11.5px ui-monospace, Menlo, monospace; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--background); min-width: 0; }
[role="tablist"] { display: flex; gap: 2px; border-block-end: 1px solid var(--border); margin: -2px -12px 8px; padding-inline: 8px; }
[role="tab"] { border: 0; background: transparent; padding: 6px 8px; cursor: pointer; font-size: 12.5px; color: var(--muted-foreground); border-block-end: 2px solid transparent; }
[role="tab"][aria-selected="true"] { color: var(--foreground); border-block-end-color: var(--foreground); font-weight: 600; }
[role="tabpanel"] { max-height: 470px; overflow: auto; font-size: 12px; }
.a11y { width: 100%; border-collapse: collapse; table-layout: fixed; }
.a11y th, .a11y td { text-align: start; vertical-align: top; padding: 4px 4px; border-block-end: 1px solid var(--border); overflow-wrap: anywhere; }

<body>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<header class="controls" aria-label="Prototype controls">
  <h1>Smart chips</h1>
  <span id="controls" style="display:contents"></span>
  <label class="ctl"><span>Scene</span><select id="scene"></select></label>
  <button class="btn" type="button" id="reset">Reset</button>
</header>

<main class="layout">
  <section class="stage" aria-label="Prototype stage">
    <p class="scene-note" id="scene-note"></p>
    <div class="win" id="win" data-device="desktop">
      <div class="tabs" id="tabs"></div>
      <div class="topbar" id="topbar"></div>
      <div class="scroller" id="scroller">
        <article class="page" id="page">
          <div id="ed" role="textbox" aria-multiline="true" aria-label="Project plan" tabindex="0" spellcheck="false"></div>
          <div id="target" class="target" tabindex="-1" hidden></div>
        </article>
      </div>
      <div id="ov"></div>
      <div id="pills"></div>
    </div>
  </section>

  <aside class="side" aria-label="Prototype panels">
    <section class="box" aria-labelledby="lib-h">
      <h2 id="lib-h"><span class="grow">Library (the index snapshot)</span><button class="btn" type="button" id="remote">Remote edit</button></h2>
      <ul class="lib-list" id="lib-list"></ul>
      <div class="clip">
        <label for="clip-in" style="flex:1 1 100%;color:var(--muted-foreground)">Clipboard (simulated: buttons paste at the caret)</label>
        <input id="clip-in" spellcheck="false">
        <button class="btn" type="button" id="paste-btn">Paste <kbd>⌘V</kbd></button>
        <button class="btn" type="button" id="paste-plain">Paste as text <kbd>⌘⇧V</kbd></button>
        <button class="btn" type="button" id="paste-hostile">Paste hostile HTML</button>
      </div>
    </section>
    <section class="box" aria-label="Inspector">
      <div role="tablist" aria-label="Inspector" id="side-tabs">
        <button role="tab" id="tab-a11y" aria-controls="panel-a11y" aria-selected="true">Accessibility</button>
        <button role="tab" id="tab-log" aria-controls="panel-log" aria-selected="false" tabindex="-1">Announcements</button>
        <button role="tab" id="tab-stored" aria-controls="panel-stored" aria-selected="false" tabindex="-1">Stored</button>
        <button role="tab" id="tab-export" aria-controls="panel-export" aria-selected="false" tabindex="-1">Export</button>
        <button role="tab" id="tab-keys" aria-controls="panel-keys" aria-selected="false" tabindex="-1">Keys</button>
      </div>
      <div role="tabpanel" id="panel-a11y" aria-labelledby="tab-a11y" tabindex="0"></div>
      <div role="tabpanel" id="panel-log" aria-labelledby="tab-log" tabindex="0" hidden></div>
      <div role="tabpanel" id="panel-stored" aria-labelledby="tab-stored" tabindex="0" hidden></div>
      <div role="tabpanel" id="panel-export" aria-labelledby="tab-export" tabindex="0" hidden></div>
      <div role="tabpanel" id="panel-keys" aria-labelledby="tab-keys" tabindex="0" hidden></div>
    </section>
  </aside>
</main>

<script>
"use strict";
/* ═════════ helpers ═════════ */
const $ = (s, r = document) => r.querySelector(s);

const short = (href) => href.replace(/([0-9a-f]{6})[0-9a-f]{20}([0-9a-f]{6})/, "$1…$2").replace(/#([0-9a-f]{8})[0-9a-f-]{28}/, "#$1…");

/* §4.1 parser, as LK1's lib/links/doc-link.ts */

/* ═════════ data ═════════ */
const K = { q4: hex32("q4"), hire: hex32("hire"), road: hex32("road"), launch: hex32("launch"), fa: hex32("fa"), cjk: hex32("cjk"), tpl: hex32("tpl"), gone: hex32("gone"), foreign: hex32("foreign"), plan: hex32("plan") };

function makeLib() {
  return {
    docs: [
      { id: "plan", key: K.plan, title: "Project plan", path: ["Work"], edited: "Today" },
      { id: "q4", key: K.q4, title: "Q4 budget", path: ["Finance"], edited: "12 Nov", snippet: "Spend for October to December: travel, hiring and tools, with the approval limits for each team.",
        headings: [{ id: TOC.travel, text: "Travel", body: "Economy fares only, booked 14 days ahead." }, { id: TOC.approvals, text: "Approvals", body: "Team leads approve up to 2,000. Above that, finance signs off." }] },
      { id: "hire", key: K.hire, title: "Hiring plan", path: ["People"], edited: "9 Nov", snippet: "Three engineers and a designer by March, in that order.", headings: [{ id: TOC.roles, text: "Roles", body: "Two backend, one frontend, one product designer." }] },
      { id: "road", key: K.road, title: "Roadmap 2027", path: ["Work"], edited: "2 Nov", snippet: "Desktop app, shared documents, then templates.", headings: [] },
      { id: "launch", key: K.launch, title: "Launch checklist", path: ["Work"], edited: "1 Nov", trashed: true, snippet: "Everything to check before the public launch.", headings: [] },
      { id: "fa", key: K.fa, title: "بودجهٔ سه‌ماههٔ چهارم", path: ["مالی"], edited: "10 Nov", snippet: "هزینه‌های سفر و استخدام برای سه ماه آخر سال.", headings: [] },
      { id: "cjk", key: K.cjk, title: "第四季度预算", path: ["Finance"], edited: "8 Nov", snippet: "差旅和招聘的季度预算。", headings: [] },
      { id: "tpl", key: K.tpl, title: "Weekly notes template", path: ["Templates"], edited: "1 Oct", kind: "template", headings: [] },

}
const C = (key, label) => ({ chip: `tinydocy:doc/${key}`, label });
const CH = (toc, label) => ({ chip: `tinydocy:here#${toc}`, label });
const L = (href, text) => ({ link: href, text });

    if (typeof p === "string") for (const c of p) out.push({ t: "x", c });
    else if (p.chip) out.push({ t: "chip", href: p.chip, label: p.label });

}
function makeDoc() {
  const B = (type, id, ...parts) => ({ type, id, units: toUnits(parts) });
  return [
    B("h1", null, "Project plan"),
    B("p", null, "Budget numbers live in ", C(K.q4, "Q4 budget"), " and the hiring targets in ", C(K.hire, "Hiring plan"), ". Read ", CH(TOC.risks, "Risks"), " before sign-off."),
    B("h2", TOC.states, "Every chip state"),
    B("p", null, "In Trash: ", C(K.launch, "Launch checklist"), " · Deleted: ", C(K.gone, "Vendor contracts"), " · Not on this device: ", C(K.foreign, "Board deck"),
      " · Needs a newer version: ", { chip: "tinydocy:board/7f3a9c", label: "Roadmap board" }, " · A CJK title: ", C(K.cjk, "第四季度预算"), "."),
    B("p", null, "A text link, for comparison: ", L(`tinydocy:doc/${K.q4}`, "Q4 budget"), ". Its text stays as typed."),
    B("h2", TOC.risks, "Risks"),
    B("p", null, "Travel may run over in December. The limits are in ", C(K.q4, "Q4 budget"), "."),
    B("p", null, "جزئیات بودجه در ", C(K.fa, "بودجهٔ سه‌ماههٔ چهارم"), " آمده است و نقش‌ها در ", C(K.hire, "Hiring plan"), "."),
    B("h2", TOC.next, "Next steps"),
    B("p", null, "Add links here: "),

/* ═════════ state ═════════ */
const CFG = { theme: "light", dir: "ltr", size: "16", lead: "1.6", motion: "full", fc: "off", mode: "edit", device: "desktop", ready: "ready", viewer: "me", live: "local" };
let LIB, S;
function freshState() {

    doc: makeDoc(), sel: { a: { b: 9, o: 16 }, h: { b: 9, o: 16 } }, hist: [], fut: [], lastKind: null,
    writes: { local: 0, remote: 0 }, repaints: 0, renameTx: 0,
    slash: null, picker: null, card: null, consent: false, consented: false,
    nav: [], view: "editor", tabs: [{ title: "Project plan", on: true }],

const ed = $("#ed"), win = $("#win"), ov = $("#ov"), scroller = $("#scroller");
const registry = new Map(); // chip element → unit (one registry per host)

/* ═════════ resolve (LK1 resolve.ts, from the snapshot) ═════════ */

  if (CFG.viewer === "collab") return { state: "not_in_library" };
  const d = LIB.docs.find((x) => x.key === p.key);
  if (!d) return { state: LIB.purged.has(p.key) ? "deleted" : "not_in_library" };
  if (d.deleted) return { state: "deleted" };
  const head = p.tocId ? (d.headings || []).find((x) => x.id === p.tocId) : null;

const ICON = { resolves: "FileText", pending: "FileText", here: "Hash", in_trash: "Trash2", deleted: "FileX", not_in_library: "FileQuestion", unknown_form: "FileQuestion" };

    case "here": text = r.title || label || "Section"; break;
    case "unknown_form": text = label || "Link"; break;
    default: text = label || "Document";
  }
  return { state: r.state, text, suffix: SUFFIX[r.state], icon: ICON[r.state], r };
}

/* ═════════ node view (vanilla DOM, §4.2a "DOM") ═════════ */
function paintChip(el, v) {

  if (S.card && S.card.kind === "chip" && S.card.b === b && S.card.i === i) el.setAttribute("data-card-open", "");

}

}

/* ═════════ selection helpers ═════════ */
const cmp = (p, q) => p.b - q.b || p.o - q.o;

}
const canChip = (b) => S.doc[b] && S.doc[b].type !== "h1";

/* ═════════ history (one entry per commit; typing coalesces) ═════════ */

/* ═════════ render ═════════ */

function renderEditor() {

    const s = bi > from.b ? 0 : bi === from.b ? from.o : Infinity;
    const e = bi < to.b ? n : bi === to.b ? to.o : -Infinity;
    const caretO = showCaret && S.sel.h.b === bi ? S.sel.h.o : -1;

    while (i <= n) {

      if (i === n) break;

      let j = i, txt = "";
      while (j < n && blk.units[j].t !== "chip" && blk.units[j].link === u.link && ((j >= s && j < e) === inSel) && (j === i || j !== caretO)) { txt += blk.units[j].c; j++; }
      const run = h("span", { class: "r" + (inSel ? " sel" : ""), "data-b": bi, "data-s": i }, txt);
      if (u.link) {
        const first = i === 0 || blk.units[i - 1].link !== u.link;
        const st = resolveHref(u.link).state;
        const a = h("a", { class: "doc-link", role: "link", "data-href": u.link, "data-b": bi, "data-i": i });
        if (S.card && S.card.kind === "link" && S.card.b === bi && linkRange(bi, S.card.i).s <= i && i < linkRange(bi, S.card.i).e) a.setAttribute("data-card-open", "");
        if (first && u.link.startsWith("tinydocy:")) a.append(h("span", { class: "doc-link-icon", "data-link-state": st, "aria-hidden": "true" }, ic(ICON[st])));
        a.append(run); be.append(a);

}

const sceneSel = $("#scene");
Object.entries(SCENES).forEach(([id, [t]]) => sceneSel.append(h("option", { value: id }, t)));
sceneSel.addEventListener("change", () => scene(sceneSel.value, { keep: true }));
$("#reset").addEventListener("click", () => scene(sceneSel.value, { keep: true }));
function scene(id, opts = {}) {
  const sc = SCENES[id]; if (!sc) throw new Error("no scene " + id);
  const keep = opts.keep ? { theme: CFG.theme, size: CFG.size, lead: CFG.lead, motion: CFG.motion, fc: CFG.fc } : {};
  const { keep: _k, side, ...cfg } = opts;
  reset({ ...keep, ...cfg });
  sceneSel.value = id;
  $("#scene-note").replaceChildren(h("b", {}, sc[0] + ". "), sc[1]);
  sc[2]();
  if (side) selectTab(side);
  lastA11yFocus = null;
  scheduleA11y();
  window.scrollTo(0, 0);
  return true;
}
function measureLineBoxes() {

  const p1 = h("p", { style: "margin:0" }, "Plain line with descenders, gyp");
  const p2 = h("p", { style: "margin:0" }, "Line with ", chipEl({ t: "chip", href: `tinydocy:doc/${K.q4}`, label: "Q4 budget" }, 0, 0, false), " gyp");
  const p3 = h("p", { style: "margin:0" }, "Line with ", chipEl({ t: "chip", href: `tinydocy:doc/${K.gone}`, label: "Vendor contracts" }, 0, 0, false), " gyp");
  m.append(p1, p2, p3); ed.append(m);
  const out = { plain: p1.getBoundingClientRect().height, chip: p2.getBoundingClientRect().height, dashed: p3.getBoundingClientRect().height };
  m.remove(); registry.clear(); render();
  return out;
}
