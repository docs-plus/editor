name: CI

# Runs on every pull request, in the merge queue and on pushes to main:
#   changes   decides whether the pull request needs the browser suites
#             (not while it is a draft, nor for docs-only changes), and
#             fetches the shard timings from the latest green main run
#   checks    Biome, ESLint, typecheck, unit tests, production build
#   e2e       the Playwright chromium and library projects in 3 shards,
#             against `next dev` + Hocuspocus and the library's Bun harness
#   perf      the typing-budget project on its own runner, one worker
#   desktop   the desktop static export and the local (dev bridge) project;
#             not a required check
#   e2e-gate  "Playwright (Chromium)": merges the shard reports and passes
#             only if every shard and perf passed, or if the pull request
#             changes docs only
#
# Required checks (the main ruleset and the merge queue use these names, so
# keep them stable): "Lint, typecheck, unit tests, build" and
# "Playwright (Chromium)". See docs/operations/deploy-runbook.md.
#
# Read-only token and no secrets: pull requests from forks run the same way.

on:
  # ready_for_review: a draft gets checks only, so marking it ready must
  # start the full run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a pull request's older run. Runs on main are never
# cancelled once started, so each one finishes and can deploy; they queue in
# commit order. GitHub keeps one pending run per group, so when a third push
# arrives while one runs, the waiting run is dropped and only the newest
# waits: the newest commit always deploys. Merge queue runs each have their
# own ref (gh-readonly-queue/...), and the queue cancels them itself.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # Reads the e2e-timings artifact of the latest green run on main.
      actions: read
    outputs:
      e2e: ${{ steps.decide.outputs.e2e }}
      skip-reason: ${{ steps.decide.outputs.skip-reason }}
      timings: ${{ steps.timings.outputs.timings }}
    steps:
      # Pull requests only: pushes to main, the merge queue and manual runs
      # always run every suite. A renamed file counts at both paths.
      - name: List changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GH_REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"

      # Skips the browser suites on pull requests only: while one is a draft
      # (marking it ready runs them), or when every changed path is under
      # docs/ or a Markdown file and none is under desktop/ (the web build
      # can still change). tests/unit/ci/ci-workflow.test.ts runs this script.
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          FILES: ${{ runner.temp }}/changed-files.txt
        run: |
          reason=""
          if [ "$EVENT" != pull_request ]; then
            e2e=true
          elif [ "$DRAFT" = true ]; then
            e2e=false
            reason=draft
          elif [ ! -s "$FILES" ]; then
            e2e=true
          elif grep -qvE '^(docs/.*|.*\.md)$' "$FILES" ||
            grep -qE '^desktop/' "$FILES"; then
            e2e=true
          else
            e2e=false
            reason=docs-only
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "skip-reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Browser suites: $e2e${reason:+ ($reason)}"

      # Per-file seconds from the latest green push run on main (published
      # by "Playwright (Chromium)" there; pull requests never write them).
      # Fetched once here, so every shard packs the same plan; anything
      # missing leaves it empty and the shards use Playwright's --shard.
      - name: Find shard timings
        id: timings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run=$(gh run list --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json databaseId \
            --jq '.[0].databaseId // empty')
          timings=""
          if [ -n "$run" ] &&
            gh run download "$run" -n e2e-timings -D "$RUNNER_TEMP/timings"; then
            timings=$(jq -c . "$RUNNER_TEMP/timings/e2e-timings.json") || timings=""
          fi
          echo "timings=$timings" >> "$GITHUB_OUTPUT"
          echo "Shard timings from run ${run:-none}: ${timings:+found}${timings:-none}"

  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &setup-bun
        name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - &install
        name: Install
        run: bun install --frozen-lockfile

      # Everything after install runs on Bun (bunfig.toml `[run] bun = true`).
      # The runner image ships Node, so a stub makes any call to it fail
      # loudly. Install comes first: lifecycle scripts (husky) call `node`.
      - &block-node
        name: Block Node.js
        run: |
          mkdir -p "$RUNNER_TEMP/no-node"
          cat > "$RUNNER_TEMP/no-node/node" <<'EOF'
          #!/bin/sh
          echo "::error::node was called: $*" >&2
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/no-node/node"
          echo "$RUNNER_TEMP/no-node" >> "$GITHUB_PATH"

      # Fail on high and critical advisories.
      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Biome
        run: bun run check

      - name: ESLint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # `bun run test` skips the stress probe; it runs below as a non-gating
      # benchmark.
      - name: Unit tests
        run: bun run test

      # Shared runners vary in speed, so a miss here is reported, not fatal.
      - name: Stress benchmark (informational)
        continue-on-error: true
        run: bun run test:stress

      - name: Production build
        run: bun run build

      # The lazy editor chunk may grow ≤ 18.5 KB gz over 58a9d22 (owner
      # decision O1, contract §10 A9; spec §7 said 6 KB).
      - name: Editor chunk size
        run: bun scripts/check-editor-chunk-size.ts

  e2e:
    name: Playwright shard ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Every shard reports, so one failure does not hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env: &e2e-env
      # Same raised limits as playwright.config.ts: three workers open many
      # sockets and documents from one IP.
      DOC_CREATION_RATE_LIMIT: "2000"
      WS_CONNECTION_LIMIT: "200"
      WS_SOCKETS_PER_IP: "600"
      WS_UPGRADE_RATE_LIMIT: "6000"
      HOCUS_THROTTLE: "0"
    steps:
      - *checkout
      - *setup-bun
      - *install
      - *block-node

      # Shared runners differ in CPU, so the model is logged: it tells a slow
      # runner from a slow test when shard times drift.
      - &install-chromium
        name: Install Chromium
        run: |
          echo "Runner CPU: $(nproc) x $(lscpu | sed -n 's/^Model name: *//p')"
          bun playwright install --with-deps chromium

      # `make dev` runs next dev and Hocuspocus on one db.sqlite (the DELETE
      # route and Hocuspocus must read the same tombstones) with isolated
      # tab lists allowed. Pages are compiled once before the tests start.
      - &start-dev-servers
        name: Start dev servers
        run: |
          make dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          for _ in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:1234 &&
              curl -sf -o /dev/null http://localhost:3000/; then
              break
            fi
            sleep 1
          done
          for path in / /about /privacy /offline; do
            curl -sf -o /dev/null --max-time 120 "http://localhost:3000$path"
          done

      # The shared library UI (components/library) runs on its own Bun
      # harness, no Next.js or Hocus (tests/harness/library). Started in
      # every shard (about a second): sharding decides which one runs it.
      - name: Start library harness
        run: |
          bun tests/harness/library/serve.ts > "$RUNNER_TEMP/library.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3871/; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:3871/

      # Spec files packed by duration (scripts/e2e-shards.ts), or
      # Playwright's own --shard (by test count) without usable timings.
      - name: Plan shard
        id: plan
        env:
          TIMINGS: ${{ needs.changes.outputs.timings }}
          SHARD: ${{ matrix.shard }}
        run: |
          printf '%s' "$TIMINGS" > "$RUNNER_TEMP/e2e-timings.json"
          args=$(bun scripts/e2e-shards.ts plan "$SHARD/3" \
            "$RUNNER_TEMP/e2e-timings.json" "$RUNNER_TEMP/shard-tests.txt")
          echo "args=$args" >> "$GITHUB_OUTPUT"

      # CI= : use the servers started above instead of Playwright's webServer.
      # One retry absorbs cold-runner timing; retried passes are still listed
      # as "flaky". The blob report is merged by "Playwright (Chromium)".
      - name: Run Playwright
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-chromium-${{ matrix.shard }}.zip
          SHARD_ARGS: ${{ steps.plan.outputs.args }}
        run: >-
          CI="" bun playwright test --project=chromium --project=library
          "$SHARD_ARGS" --retries=1 --trace off --reporter=list,blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-chromium-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: |
            test-results/
            ${{ runner.temp }}/dev.log
            ${{ runner.temp }}/library.log
          if-no-files-found: ignore
          retention-days: 7

  perf:
    name: Playwright perf (typing budget)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env: *e2e-env
    steps:
      - *checkout
      - *setup-bun
      - *install
      - *block-node
      - *install-chromium
      - *start-dev-servers

      # The typing budget compares timings, so it gets a runner of its own
      # and one worker (the project's setting). --no-deps: the project
      # depends on chromium, which the shards run.
      - name: Run Playwright
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-perf.zip
        run: >-
          CI="" bun playwright test --project=perf --no-deps --retries=1
          --trace off --reporter=list,blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-perf
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-perf
          path: |
            test-results/
            ${{ runner.temp }}/dev.log
          if-no-files-found: ignore
          retention-days: 7

  # Not a required check. Docs-only pull requests skip it with the browser
  # suites; desktop/** changes always run it (see `changes`).
  desktop:
    name: Desktop renderer (export and local)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-bun
      - *install
      - *block-node
      - *install-chromium

      # Built on Linux, as releases build it (#103). Fails if a web-only
      # route, a web metadata tag, the dev bridge or the Windows segment
      # layout reaches out/.
      - name: Desktop export
        run: bun run build:desktop

      # The export served with the app:// protocol handler's path rules.
      - name: Desktop project (export)
        run: |
          PORT=3849 bun scripts/serve-desktop-export.ts > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3849/ && break
            sleep 1
          done
          DESKTOP_BASE_URL=http://127.0.0.1:3849 CI="" bun playwright test --project=desktop --retries=1 --trace retain-on-failure

      # The desktop renderer under next dev over the dev bridge, no Hocus
      # (architecture §11). Each Playwright worker starts its own storage
      # host, so each has its own library. No retries: a race between a
      # reload's new connection and the old one's release must fail here.
      - name: Local project (dev bridge)
        run: |
          NEXT_PUBLIC_APP_TARGET=desktop NEXT_PUBLIC_DESKTOP_BRIDGE=dev \
            bun next dev -p 3926 > "$RUNNER_TEMP/next-local.log" 2>&1 &
          for _ in $(seq 1 120); do
            curl -sf -o /dev/null http://localhost:3926/ && break
            sleep 1
          done
          curl -sf -o /dev/null --max-time 120 http://localhost:3926/
          LOCAL_BASE_URL=http://localhost:3926 CI="" bun playwright test --project=local --retries=0 --trace retain-on-failure

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-results
          path: |
            test-results/
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The required check. It always runs, because a skipped required check
  # counts as passing: it passes only if every shard and perf passed, or if
  # `changes` skipped them for a draft or docs-only pull request. Anywhere
  # else (a ready pull request, the merge queue, main) a skip fails it.
  e2e-gate:
    name: Playwright (Chromium)
    needs: [changes, e2e, perf]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Also on a docs-only pull request (about 15 s), so the steps stay
      # the same as the other jobs'.
      - *checkout
      - *setup-bun
      - *install
      - *block-node

      - name: Download blob reports
        if: needs.changes.outputs.e2e == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # One report for all shards and perf: each failure is annotated at its
      # test (file and line) on the run and the pull request, and the HTML
      # report is uploaded when something failed.
      - name: Merge reports
        if: needs.changes.outputs.e2e == 'true'
        continue-on-error: true
        run: bun playwright merge-reports --reporter=github,html all-blob-reports

      - name: Upload HTML report
        if: needs.e2e.result == 'failure' || needs.perf.result == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verdict
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          RUN_E2E: ${{ needs.changes.outputs.e2e }}
          REASON: ${{ needs.changes.outputs.skip-reason }}
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.e2e.result }}
          PERF: ${{ needs.perf.result }}
        run: |
          echo "event=$EVENT changes=$CHANGES e2e=$RUN_E2E ($REASON) shards=$SHARDS perf=$PERF"
          if [ "$CHANGES" != success ]; then
            echo "::error::Changed files job: $CHANGES"; exit 1
          fi
          if [ "$EVENT" = pull_request ] && [ "$RUN_E2E" = false ] &&
            [ "$SHARDS" = skipped ] && [ "$PERF" = skipped ]; then
            case "$REASON" in
              draft)
                echo "::notice::Draft pull request: browser suites run once it is marked ready for review"
                exit 0 ;;
              docs-only)
                echo "::notice::Docs-only pull request: browser suites skipped"
                exit 0 ;;
            esac
          fi
          if [ "$SHARDS" != success ] || [ "$PERF" != success ]; then
            echo "::error::Playwright shards: $SHARDS, perf: $PERF"; exit 1
          fi

      # Green pushes to main only: the shard timings the next runs pack by.
      - name: Write shard timings
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/report.json
        run: |
          bun playwright merge-reports --reporter=json all-blob-reports
          bun scripts/e2e-shards.ts timings "$RUNNER_TEMP/report.json" e2e-timings.json

      - name: Publish shard timings
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-timings
          path: e2e-timings.json
          retention-days: 30
