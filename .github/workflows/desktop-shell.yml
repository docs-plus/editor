name: Desktop shell

# P2.5: the unsigned internal build matrix and the `electron` Playwright
# project (plan §8.4 P2.5; architecture §3.1, §11).
#
# 1. `renderer` exports `out/` once, on Linux (#103: Windows writes the
#    wrong segment-prefetch layout), and hands the same bytes to each OS.
# 2. `package` (macOS, Windows, Linux), with the Node stub on PATH:
#    - release flavor (what ships: no test hooks, inspect fuse off): builds
#      and installs the installers, reads the fuses back out of the
#      installed binary, starts it with its default userData, proves a deep
#      link plus --inspect=9229 opens no inspector, and closes it;
#    - test flavor (never shipped: test hooks in, inspect fuse on): an
#      unpacked build that the self-test and the `electron` specs drive.
#    The quit timings land in the job summary and the artifacts.
#
# 3. `gate` ("Desktop shell (gate)") is the check the ruleset can require.
#    It always runs, because a skipped required check counts as passing.
#
# Runs on every pull request, in the merge queue, nightly through
# `nightly.yml` (workflow_call) and on demand. On a pull request, `changes`
# runs the build only when it touches the shell's paths (the list in its
# Decide step) and is not a draft; the merge queue, nightly and manual runs
# always build. Read-only token and no secrets, like CI.

on:
  # ready_for_review: a draft skips the build, so marking it ready must run
  # it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-shell-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # The renderer and main's connect-src agree on the sync server. CI runs a
  # loopback Hocus; nothing reaches production.
  NEXT_PUBLIC_HOCUS_URL: ws://127.0.0.1:1234

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      skip-reason: ${{ steps.decide.outputs.skip-reason }}
    steps:
      - name: List changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GH_REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"

      # Pull requests only: skip while a draft, or when no changed path is
      # one the shell is built from. Every other event builds.
      # tests/unit/ci/desktop-shell-workflow.test.ts runs this script.
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          FILES: ${{ runner.temp }}/changed-files.txt
        run: |
          paths='^(desktop/|lib/platform/desktop/|tests/electron/)'
          paths="$paths|^(lib/security/content-security-policy\.ts|scripts/build-desktop\.ts"
          paths="$paths|scripts/desktop-export\.ts|next\.config\.ts|playwright\.electron\.config\.ts"
          paths="$paths|package\.json|bun\.lock|\.github/workflows/desktop-shell\.yml)$"
          reason=""
          if [ "$EVENT" != pull_request ]; then
            build=true
          elif [ "$DRAFT" = true ]; then
            build=false
            reason=draft
          elif [ ! -s "$FILES" ] || grep -qE "$paths" "$FILES"; then
            build=true
          else
            build=false
            reason=no-shell-changes
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "skip-reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Desktop shell build: $build${reason:+ ($reason)}"

  renderer:
    name: Renderer export (Linux)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Install
        run: bun install --frozen-lockfile

      - name: Block Node.js
        run: |
          mkdir -p "$RUNNER_TEMP/no-node"
          cat > "$RUNNER_TEMP/no-node/node" <<'EOF'
          #!/bin/sh
          echo "::error::node was called: $*" >&2
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/no-node/node"
          echo "$RUNNER_TEMP/no-node" >> "$GITHUB_PATH"

      - name: Export the desktop renderer
        run: bun run build:desktop

      - name: Upload out/
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-renderer
          path: out/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  package:
    name: Package, install and test (${{ matrix.os }})
    needs: renderer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      # The root install brings Electron's types and Playwright; the build
      # folder has its own lockfile for electron-builder.
      - name: Install
        run: |
          bun install --frozen-lockfile
          (cd desktop/build && bun install --frozen-lockfile)

      - name: Audit the packaging dependencies
        working-directory: desktop/build
        run: bun audit --audit-level=high

      - name: Download out/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-renderer
          path: out

      # Everything after install runs on Bun. Windows spawns look for
      # node.exe, so a compiled stub sits beside the sh one (spike S3).
      - name: Block Node.js
        run: |
          mkdir -p "$RUNNER_TEMP/no-node"
          cat > "$RUNNER_TEMP/no-node/node" <<'EOF'
          #!/bin/sh
          echo "::error::node was called: $*" >&2
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/no-node/node"
          echo "$RUNNER_TEMP/no-node" >> "$GITHUB_PATH"
          if [ "$RUNNER_OS" = Windows ]; then
            cat > "$RUNNER_TEMP/node-stub.ts" <<'EOF'
          console.error(`::error::node was called: ${process.argv.slice(2).join(" ")}`);
          process.exit(1);
          EOF
            bun build --compile "$RUNNER_TEMP/node-stub.ts" --outfile "$RUNNER_TEMP/no-node/node.exe"
          fi

      # --- Release flavor: what ships. No test hooks (SEC-006), the inspect
      # fuse off (SEC-001). Its connect-src is the production server, while
      # the renderer was exported for loopback, so the CSP blocks every
      # sync attempt and nothing reaches production.
      - name: Bundle and stage (release)
        env:
          NEXT_PUBLIC_HOCUS_URL: wss://ws.tiny.docs.plus
        run: bun desktop/build/build.ts --flavor release

      - name: Build the installers
        working-directory: desktop/build
        run: |
          case "$RUNNER_OS" in
            macOS) targets="--mac dmg --arm64" ;;
            Windows) targets="--win nsis --x64" ;;
            Linux) targets="--linux deb AppImage --x64" ;;
          esac
          bun electron-builder --config electron-builder.yml $targets --publish never 2>&1 | tee "$RUNNER_TEMP/builder.log"
          if grep -q "node was called" "$RUNNER_TEMP/builder.log"; then
            echo "::error::electron-builder called node"
            exit 1
          fi
          ls -la ../../dist/desktop-release

      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls dist/desktop-release/*.dmg | head -1)
          hdiutil attach -nobrowse -noautoopen -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          cp -R "$RUNNER_TEMP/dmg/TinyDocy.app" /Applications/
          hdiutil detach "$RUNNER_TEMP/dmg"
          codesign --verify --deep --verbose=2 /Applications/TinyDocy.app || true
          echo "RELEASE_EXECUTABLE=/Applications/TinyDocy.app/Contents/MacOS/TinyDocy" >> "$GITHUB_ENV"
          echo "RELEASE_FUSE_TARGET=/Applications/TinyDocy.app" >> "$GITHUB_ENV"

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/desktop-release/*-setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Recurse -Filter TinyDocy.exe | Select-Object -First 1
          if (-not $exe) { throw "TinyDocy.exe is not installed" }
          Write-Output "installed at $($exe.FullName)"
          "RELEASE_EXECUTABLE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "RELEASE_FUSE_TARGET=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/desktop-release/*.deb
          # The package links /usr/bin/tinydocy (update-alternatives) to
          # the installed binary.
          bin=$(readlink -f /usr/bin/tinydocy)
          test -f "$bin" && test -x "$bin"
          echo "RELEASE_EXECUTABLE=$bin" >> "$GITHUB_ENV"
          echo "RELEASE_FUSE_TARGET=$bin" >> "$GITHUB_ENV"
          grep -E '^(MimeType|StartupWMClass)=' /usr/share/applications/tinydocy.desktop
          # Chromium's sandbox needs unprivileged user namespaces
          # (electron/electron#42510); the .deb's AppArmor profile covers
          # real desktops.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check the fuses in the installed binary (inspect off)
        run: bun desktop/build/check-fuses.ts "$RELEASE_FUSE_TARGET" --inspect off

      # Start with the default userData, open the library, hand a deep link
      # plus --inspect=9229 to a second instance, prove nothing listens on
      # 9229, then close gracefully.
      - name: Smoke the installed release app (no inspector)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bun desktop/build/release-smoke.ts "$RELEASE_EXECUTABLE"
          else
            bun desktop/build/release-smoke.ts "$RELEASE_EXECUTABLE"
          fi

      # The installer doesn't register tinydocy://; the app does on its first
      # start (setAsDefaultProtocolClient). The link must come last and
      # after "--", so it can never be read as a switch (SEC-001).
      - name: Check the tinydocy:// handler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\tinydocy\shell\open\command' -ErrorAction SilentlyContinue).'(default)'
          Write-Output "tinydocy:// handler: $cmd"
          if (-not $cmd) { throw "tinydocy:// is not registered" }
          if (-not $cmd.StartsWith('"' + $env:RELEASE_EXECUTABLE + '"', [StringComparison]::OrdinalIgnoreCase)) { throw "the handler does not run the installed app" }
          if (-not $cmd.EndsWith(' -- "%1"')) { throw 'the handler must end with -- "%1"' }

      # No FUSE on the runner: run the AppImage's extracted AppRun, with a
      # fresh default userData so the library check isn't the .deb's.
      - name: Smoke the release AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          image=$(ls "$PWD"/dist/desktop-release/*.AppImage | head -1)
          chmod +x "$image"
          rm -rf "$HOME/.config/TinyDocy"
          (cd "$RUNNER_TEMP" && "$image" --appimage-extract > /dev/null)
          xvfb-run -a bun desktop/build/release-smoke.ts "$RUNNER_TEMP/squashfs-root/AppRun"

      # --- Test flavor: the same code with the test hooks compiled in, and
      # an unpacked build with the inspect fuse on, because Playwright's
      # _electron attaches through the inspector. Never shipped.
      - name: Bundle and stage (test)
        env:
          NEXT_PUBLIC_HOCUS_URL: ws://127.0.0.1:1234
        run: bun desktop/build/build.ts --flavor test

      - name: Build the unpacked test app
        working-directory: desktop/build
        run: |
          case "$RUNNER_OS" in
            macOS) arch="--mac --arm64" ;;
            Windows) arch="--win --x64" ;;
            Linux) arch="--linux --x64" ;;
          esac
          bun electron-builder --config electron-builder.yml $arch --dir --publish never \
            -c.directories.output=../../dist/desktop-test \
            -c.electronFuses.enableNodeCliInspectArguments=true 2>&1 | tee "$RUNNER_TEMP/builder-test.log"
          if grep -q "node was called" "$RUNNER_TEMP/builder-test.log"; then
            echo "::error::electron-builder called node"
            exit 1
          fi
          root="$(cd ../.. && pwd)/dist/desktop-test"
          case "$RUNNER_OS" in
            macOS) app="$root/mac-arm64/TinyDocy.app"; bin="$app/Contents/MacOS/TinyDocy" ;;
            Windows) bin="$(cygpath -w "$root/win-unpacked/TinyDocy.exe")"; app="$bin" ;;
            Linux) bin="$root/linux-unpacked/tinydocy"; app="$bin" ;;
          esac
          test -e "$app"
          echo "TINYDOCY_EXECUTABLE=$bin" >> "$GITHUB_ENV"
          echo "TEST_FUSE_TARGET=$app" >> "$GITHUB_ENV"

      - name: Check the fuses in the test app (inspect on)
        run: bun desktop/build/check-fuses.ts "$TEST_FUSE_TARGET" --inspect on

      - name: Start the test app once and quit
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bun desktop/build/self-test.ts "$TINYDOCY_EXECUTABLE"
          else
            bun desktop/build/self-test.ts "$TINYDOCY_EXECUTABLE"
          fi

      - name: Electron specs (test app)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bun playwright test -c playwright.electron.config.ts
          else
            bun playwright test -c playwright.electron.config.ts
          fi

      - name: Quit timings
        if: always()
        run: |
          for f in test-results-electron/quit-timings-*.json; do
            [ -f "$f" ] || continue
            { echo "### Quit timings ($RUNNER_OS)"; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-shell-results-${{ matrix.os }}
          path: |
            test-results-electron/
            playwright-report-electron/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tinydocy-internal-${{ matrix.os }}
          path: |
            dist/desktop-release/*.dmg
            dist/desktop-release/*.exe
            dist/desktop-release/*.deb
            dist/desktop-release/*.AppImage
          retention-days: 14
          if-no-files-found: error

  # The required check. It passes only if the renderer and every package leg
  # passed, or if `changes` skipped them on a pull request (a draft, or no
  # shell paths changed). In the merge queue, nightly and manual runs a skip
  # fails it.
  gate:
    name: Desktop shell (gate)
    needs: [changes, renderer, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verdict
        env:
          EVENT: ${{ github.event_name }}
          BUILD: ${{ needs.changes.outputs.build }}
          REASON: ${{ needs.changes.outputs.skip-reason }}
          CHANGES: ${{ needs.changes.result }}
          RENDERER: ${{ needs.renderer.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          echo "event=$EVENT changes=$CHANGES build=$BUILD ($REASON) renderer=$RENDERER package=$PACKAGE"
          if [ "$CHANGES" != success ]; then
            echo "::error::Changed files job: $CHANGES"; exit 1
          fi
          if [ "$EVENT" = pull_request ] && [ "$BUILD" = false ] &&
            [ "$RENDERER" = skipped ] && [ "$PACKAGE" = skipped ]; then
            case "$REASON" in
              draft)
                echo "::notice::Draft pull request: the desktop shell builds once it is marked ready for review"
                exit 0 ;;
              no-shell-changes)
                echo "::notice::No desktop shell paths changed: build skipped"
                exit 0 ;;
            esac
          fi
          if [ "$RENDERER" != success ] || [ "$PACKAGE" != success ]; then
            echo "::error::Renderer: $RENDERER, package: $PACKAGE"; exit 1
          fi
