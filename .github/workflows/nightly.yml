name: Nightly

# The test layers CI skips on pull requests, twice a day on main:
#   pwa    service worker and offline tests against a production build,
#          then the palette budget (contract A6) on the same build
#   soak   Yjs reconnection soak, a quick multi-user soak and a 5-minute
#          single-user soak against next dev
#   load   the Yjs load harness (100 clients, both scenarios) against
#          Hocuspocus
#   color-soak     50,000 alternating textColor/highlight/fontSize toggles
#                  from 3 clients against Hocuspocus (spec §7 abuse soak)
#   mixed-version  N+1, release N and pre-N clients on one document with
#                  the gate env at its default (spec §3.1 N+1 ship gate)
#
# Read-only token and no secrets, like CI. A red run means a regression in
# offline editing, long sessions, concurrency or schema rollout safety that
# no PR check covers.

on:
  schedule:
    # Twice daily: 03:41 UTC (night) and 08:00 UTC (morning).
    - cron: "41 3 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # One runner opens many sockets and documents from one IP.
  DOC_CREATION_RATE_LIMIT: "2000"
  WS_CONNECTION_LIMIT: "200"
  WS_SOCKETS_PER_IP: "600"
  WS_UPGRADE_RATE_LIMIT: "6000"
  HOCUS_THROTTLE: "0"

jobs:
  pwa:
    name: Service worker and offline (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun playwright install --with-deps chromium

      - name: Production build
        run: bun run build

      # The service worker runs only in production builds; Hocuspocus allows
      # the per-test tab lists (make dev-hocus).
      - name: Start servers
        id: servers
        run: |
          PORT=3847 bun run start > "$RUNNER_TEMP/next.log" 2>&1 &
          make dev-hocus > "$RUNNER_TEMP/hocus.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:1234 &&
              curl -sf -o /dev/null http://localhost:3847/; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::servers did not start"
          exit 1

      - name: Run the pwa project
        run: >-
          PWA_BASE_URL=http://localhost:3847 CI=
          bun playwright test --project=pwa --trace retain-on-failure

      # Contract A6: the palette chunk plus cmdk that the first Alt+/ loads
      # stays within 20 KB gz. Only a production build measures it.
      - name: Palette budget
        if: ${{ !cancelled() && steps.servers.outcome == 'success' }}
        run: >-
          PALETTE_BUDGET=1 E2E_BASE_URL=http://localhost:3847 CI=
          bun playwright test --project=chromium tests/e2e/palette.spec.ts
          --grep "palette budget" --trace retain-on-failure

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-pwa
          path: |
            test-results/
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

  soak:
    name: Soak (Yjs, multi-user, single-user)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun playwright install --with-deps chromium

      - name: Start dev servers
        run: |
          make dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          for _ in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:1234 &&
              curl -sf -o /dev/null http://localhost:3000/; then
              break
            fi
            sleep 1
          done
          curl -sf -o /dev/null --max-time 120 http://localhost:3000/

      - name: Yjs reconnection and rapid tab switch
        run: CI= bun playwright test --project=yjs-soak --trace retain-on-failure

      - name: Multi-user soak (30 s, 3 users)
        run: >-
          SOAK_DURATION=30000 SOAK_HEADINGS=10 SOAK_USERS=3 CI=
          bun playwright test --project=soak soak-collab.spec.ts
          --trace retain-on-failure

      - name: Single-user soak (5 min, 50 headings)
        run: >-
          SOAK_DURATION=300000 SOAK_HEADINGS=50 CI=
          bun playwright test --project=soak soak.spec.ts
          --trace retain-on-failure

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-soak
          path: |
            test-results/
            ${{ runner.temp }}/dev.log
          if-no-files-found: ignore
          retention-days: 7

  load:
    name: Yjs load harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Install
        run: bun install --frozen-lockfile

      - name: Start Hocuspocus
        run: |
          make dev-hocus > "$RUNNER_TEMP/hocus.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:1234 && exit 0
            sleep 1
          done
          echo "::error::Hocuspocus did not start"
          exit 1

      - name: Distributed edits (100 clients, 30 s)
        run: bun run test:load
        env:
          LOAD_SCENARIO: distributed

      - name: Conflicting edits (100 clients, 30 s)
        run: bun run test:load
        env:
          LOAD_SCENARIO: conflict

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-load
          path: ${{ runner.temp }}/hocus.log
          if-no-files-found: ignore
          retention-days: 7

  color-soak:
    name: Alternating colour soak (50k toggles)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Production's cap (ecosystem.config.cjs), for the server and the
      # assertion: 50,000 toggles grow the state to about 1.1 MB (Yjs keeps
      # a tombstone per removed format run), past the 1 MiB default.
      MAX_DOC_SIZE_BYTES: "2097152"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Install
        run: bun install --frozen-lockfile

      # Everything after install runs on Bun (bunfig.toml `[run] bun = true`).
      # The runner image ships Node, so a stub makes any call to it fail
      # loudly. Install comes first: lifecycle scripts (husky) call `node`.
      - name: Block Node.js
        run: |
          mkdir -p "$RUNNER_TEMP/no-node"
          cat > "$RUNNER_TEMP/no-node/node" <<'EOF'
          #!/bin/sh
          echo "::error::node was called: $*" >&2
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/no-node/node"
          echo "$RUNNER_TEMP/no-node" >> "$GITHUB_PATH"

      - name: Start Hocuspocus
        run: |
          make dev-hocus > "$RUNNER_TEMP/hocus.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:1234 && exit 0
            sleep 1
          done
          echo "::error::Hocuspocus did not start"
          exit 1

      # Fails on refusals (4422/4413), divergence, schema misfits, the size
      # cap or super-linear growth; the server log is scanned too.
      - name: Alternating colour soak (50,000 toggles, 3 clients)
        run: bun run test:soak:color
        env:
          COLOR_SOAK_TOGGLES: "50000"
          SOAK_HOCUS_LOG: ${{ runner.temp }}/hocus.log

      - name: Upload server log and report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-color-soak
          path: |
            test-reports/
            ${{ runner.temp }}/hocus.log
          if-no-files-found: ignore
          retention-days: 7

  mixed-version:
    name: Mixed-version soak (N+1, N, pre-N)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Throttle on, as in production: refused pre-N clients must not get
      # the runner banned (ws_throttle_ban is scanned for).
      HOCUS_THROTTLE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Install
        run: bun install --frozen-lockfile

      # Everything after install runs on Bun (bunfig.toml `[run] bun = true`).
      # The runner image ships Node, so a stub makes any call to it fail
      # loudly. Install comes first: lifecycle scripts (husky) call `node`.
      - name: Block Node.js
        run: |
          mkdir -p "$RUNNER_TEMP/no-node"
          cat > "$RUNNER_TEMP/no-node/node" <<'EOF'
          #!/bin/sh
          echo "::error::node was called: $*" >&2
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/no-node/node"
          echo "$RUNNER_TEMP/no-node" >> "$GITHUB_PATH"

      - name: Start Hocuspocus
        run: |
          make dev-hocus > "$RUNNER_TEMP/hocus.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:1234 && exit 0
            sleep 1
          done
          echo "::error::Hocuspocus did not start"
          exit 1

      # HOCUS_MIN_CLIENT_SCHEMA stays unset: the built-in floor (2) alone
      # must refuse the pre-N clients.
      - name: Mixed-version soak (300 rounds per phase)
        run: bun run test:soak:mixed-version
        env:
          MIXED_SOAK_ROUNDS: "300"
          SOAK_HOCUS_LOG: ${{ runner.temp }}/hocus.log

      - name: Upload server log and report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-mixed-version
          path: |
            test-reports/
            ${{ runner.temp }}/hocus.log
          if-no-files-found: ignore
          retention-days: 7
