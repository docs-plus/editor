name: Spike Windows export (#103, #111)

# Throwaway spike (P2.5). Runs only on the spike branch; never merged to
# main. No secrets and no environments: the grep step checks it.
#  - repro:   a 3-page Next app exported on 3 OSes × 2 Next versions (#103)
#  - exdev:   the TinyDocy desktop export on windows-latest, no TMP/TEMP
#             override, plus a negative control that must hit EXDEV (#111)
#  - handoff: the export built once on Linux, checked byte-for-byte and by
#             URL on Windows and macOS (option (a) for #103)

on:
  push:
    branches: [spike/windows-export]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-windows-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    name: repro ${{ matrix.os }} next ${{ matrix.next }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-26]
        # 16.4.6 is `latest`; canary.49 is the newest canary older than the
        # 3-day minimumReleaseAge on 2026-11-17 (canary.53's source is unchanged).
        next: ["16.4.6", "16.5.0-canary.49"]
    defaults:
      run:
        shell: bash
        working-directory: spikes/windows-export/repro
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No secrets or environments in this workflow
        working-directory: .
        run: "! grep -nE 'secret[s][[:space:]]*[.[]|environmen[t][[:space:]]*:' .github/workflows/spike-windows-export.yml"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Install
        run: |
          bun install --frozen-lockfile
          if [ "${{ matrix.next }}" != "16.4.6" ]; then
            bun add --exact "next@${{ matrix.next }}"
          fi

      - name: next info
        run: bun next info

      - name: Block Node.js
        run: |
          mkdir -p "$RUNNER_TEMP/no-node"
          cat > "$RUNNER_TEMP/no-node/node" <<'EOF'
          #!/bin/sh
          echo "::error::node was called: $*" >&2
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/no-node/node"
          echo "$RUNNER_TEMP/no-node" >> "$GITHUB_PATH"

      - name: Block Node.js (Windows twin)
        if: runner.os == 'Windows'
        run: |
          printf '@echo ::error::node was called: %%*\r\n@exit /b 1\r\n' > "$RUNNER_TEMP/no-node/node.cmd"

      - name: Export
        run: bun next build

      - name: Segment files and client URLs
        env:
          CHECK_SEGMENTS_JSON: ${{ runner.temp }}/repro-${{ matrix.os }}-${{ matrix.next }}.json
        run: |
          find out -name '*.txt' | sort
          bun ../check-segments.ts . "repro ${{ matrix.os }} next ${{ matrix.next }}"
          { echo '```json'; cat "$CHECK_SEGMENTS_JSON"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-${{ matrix.os }}-${{ matrix.next }}
          path: ${{ runner.temp }}/repro-*.json
          if-no-files-found: ignore

  exdev:
    name: exdev windows-latest (no TMP override)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      NEXT_PUBLIC_HOCUS_URL: ws://127.0.0.1:1294
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Install
        run: bun install --frozen-lockfile

      - name: Block Node.js
        run: |
          mkdir -p "$RUNNER_TEMP/no-node"
          printf '#!/bin/sh\necho "::error::node was called: $*" >&2\nexit 1\n' > "$RUNNER_TEMP/no-node/node"
          chmod +x "$RUNNER_TEMP/no-node/node"
          printf '@echo ::error::node was called: %%*\r\n@exit /b 1\r\n' > "$RUNNER_TEMP/no-node/node.cmd"
          echo "$RUNNER_TEMP/no-node" >> "$GITHUB_PATH"

      - name: Temp dir is the runner default
        run: |
          echo "TMP=${TMP:-<unset>} TEMP=${TEMP:-<unset>} TMPDIR=${TMPDIR:-<unset>}"
          bun -e 'const os=require("node:os"),p=require("node:path");const a=p.parse(process.cwd()).root,b=p.parse(os.tmpdir()).root;console.log(`checkout on ${a}, os.tmpdir() ${os.tmpdir()} on ${b}`);if(a.toLowerCase()===b.toLowerCase()){console.log("::error::same drive: this run cannot show EXDEV");process.exit(1)}'

      - name: Negative control (old code path must hit EXDEV)
        run: |
          bun -e '
          const fs=require("node:fs"),os=require("node:os"),p=require("node:path");
          const src=p.join(process.cwd(),"exdev-probe.txt");fs.writeFileSync(src,"x");
          const dst=p.join(fs.mkdtempSync(p.join(os.tmpdir(),"s1-overlay-")),"exdev-probe.txt");
          try{fs.renameSync(src,dst);console.log("::error::rename across drives succeeded");process.exit(1)}
          catch(e){console.log(`renameSync checkout -> os.tmpdir(): ${e.code}`);fs.unlinkSync(src);if(e.code!=="EXDEV")process.exit(1)}'

      - name: Desktop export (parks inside the checkout)
        run: bun spikes/s1-shell/build-export.ts

      - name: app/ is restored
        run: |
          git status --porcelain -- app
          test -z "$(git status --porcelain -- app)"

      - name: TinyDocy export on Windows (segment layout)
        run: bun spikes/windows-export/check-segments.ts . "tinydocy windows-latest"

  handoff-build:
    name: handoff build (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_HOCUS_URL: ws://127.0.0.1:1294
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Install
        run: bun install --frozen-lockfile

      - name: Desktop export
        run: bun spikes/s1-shell/build-export.ts

      - name: Checksum manifest
        run: bun spikes/windows-export/hash-tree.ts out > renderer.sha256

      - name: Upload renderer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-linux
          path: |
            out/
            renderer.sha256
          include-hidden-files: true
          if-no-files-found: error

  handoff-check:
    name: handoff check ${{ matrix.os }}
    needs: handoff-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      # check-segments only reads next's version from node_modules.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Download renderer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: renderer-linux
          path: handoff

      - name: Byte-identical after the hop
        run: |
          bun spikes/windows-export/hash-tree.ts handoff/out > here.sha256
          diff handoff/renderer.sha256 here.sha256
          echo "$(wc -l < here.sha256) files match"

      - name: Segment layout and client URLs
        run: |
          rm -rf out && mv handoff/out out
          bun spikes/windows-export/check-segments.ts . "linux-built renderer on ${{ matrix.os }}"
