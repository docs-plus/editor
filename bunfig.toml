# Supply-chain guardrail: only resolve package versions that have been
# public for at least 3 days (value in seconds). Gives the registry and the
# community time to catch and unpublish compromised releases before
# `bun add` / `bun update` (local or in CI) can pick them up.
[install]
minimumReleaseAge = 259200

# Run package bins (next, eslint, playwright, ...) on the Bun runtime
# instead of Node, for `bun run` scripts and `bun <bin>`. Plain `bunx`
# ignores this setting; use `bunx --bun` for packages that are not installed.
[run]
bun = true

# `bun test`: unit tests only (Playwright specs live in tests/e2e), with a
# happy-dom window preloaded.
[test]
root = "tests/unit"
preload = ["./tests/setup.ts"]
